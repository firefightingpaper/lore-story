<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LORE — Digital Archaeology</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --taupe: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', -apple-system, sans-serif; background: #050505; color: #e8e8e8; overflow-x: hidden; }
        .bg-curve { position: fixed; top: 0; right: 0; width: 60%; height: 80vh; background: radial-gradient(ellipse at 70% 30%, rgba(188, 254, 47, 0.08), transparent 60%); z-index: 0; pointer-events: none; }

        @media (max-width: 768px) { .container { padding: 24px 20px; } }
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-bottom: 60px; align-items: center; }
        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; gap: 32px; text-align: center; margin-bottom: 40px; }
            .hero-right { order: -1; } /* leaf above text on mobile */
        }
        .hero-left h1 { font-size: 5rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg, #ffffff 0%, #bcfe2f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 20px; }
        @media (max-width: 768px) { .hero-left h1 { font-size: 3.2rem; } }
        .hero-left .tagline { font-size: 1rem; color: #8a8a8a; margin-bottom: 32px; line-height: 1.5; }
        @media (max-width: 768px) { .hero-left .tagline { font-size: 0.9rem; margin-bottom: 24px; } }

        .badge { background: rgba(188, 254, 47, 0.08); border: 1px solid rgba(188, 254, 47, 0.2); padding: 6px 16px; border-radius: 40px; font-size: 0.7rem; font-weight: 500; color: #bcfe2f; }
        .cta-btn { background: linear-gradient(135deg, #f5a623, #e8951a); color: #050505; border: none; padding: 16px 40px; font-size: 1rem; font-weight: 700; border-radius: 60px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(245, 166, 35, 0.3); animation: pulse-glow 2s infinite; }
        @media (max-width: 768px) { .cta-btn { width: 100%; padding: 16px 24px; } }

        .data-leaf { position: relative; width: 280px; height: 280px; background: linear-gradient(135deg, rgba(188, 254, 47, 0.1), rgba(188, 254, 47, 0.02)); border-radius: 60% 40% 50% 50% / 40% 50% 50% 60%; animation: float-leaf 6s ease-in-out infinite; margin: 0 auto; }
        @media (max-width: 768px) { .data-leaf { width: 160px; height: 160px; } .data-leaf::before { font-size: 2.5rem; } }
        @keyframes float-leaf { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
        .data-leaf::before { content: '💬'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; opacity: 0.8; }
        .global-filter { background: rgba(42, 42, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(188, 254, 47, 0.15); border-radius: 60px; padding: 12px 24px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
        .filter-label { font-size: 0.75rem; font-weight: 500; color: #bcfe2f; display: flex; align-items: center; gap: 8px; }

        .double-slider { position: relative; height: 4px; background: #2a2a2a; border-radius: 2px; margin: 20px 0; }
        .slider-track-fill { position: absolute; height: 4px; background: #bcfe2f; border-radius: 2px; pointer-events: none; }
        input[type="range"] { position: absolute; width: 100%; height: 4px; -webkit-appearance: none; background: transparent; pointer-events: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #bcfe2f; border-radius: 50%; cursor: pointer; border: 2px solid #050505; pointer-events: auto; }
        .date-controls { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 40px; }
        .date-picker-btn { background: transparent; border: 1px solid rgba(188, 254, 47, 0.3); color: #bcfe2f; padding: 6px 14px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; }
        .date-picker-btn:hover { background: rgba(188, 254, 47, 0.1); }
        .date-range-display { font-size: 0.7rem; color: #bcfe2f; font-family: monospace; cursor: pointer; }
        .calendar-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .calendar-modal.show { display: flex; }
        .calendar-card { background: #1a1a1a; border: 1px solid #bcfe2f; border-radius: 24px; padding: 28px; width: 360px; }
        .calendar-title { font-size: 1rem; color: #bcfe2f; margin-bottom: 20px; text-align: center; }
        .calendar-input-group { margin-bottom: 20px; }
        .calendar-input-group label { font-size: 0.7rem; color: #8a8a8a; display: block; margin-bottom: 6px; }
        .calendar-input-group input { width: 100%; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 12px; padding: 12px; color: #e8e8e8; }
        .calendar-error { color: #f5a623; font-size: 0.7rem; margin-top: 8px; display: none; }
        .calendar-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .calendar-btn { flex: 1; background: #2a2a2a; border: none; padding: 10px; border-radius: 40px; color: #e8e8e8; cursor: pointer; }
        .calendar-btn.primary { background: #bcfe2f; color: #050505; font-weight: 600; }
        .pillars-container { background: rgba(42, 42, 42, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(188, 254, 47, 0.15); border-radius: 28px; padding: 32px 40px; margin-bottom: 24px; }
        @media (max-width: 768px) { .pillars-container { padding: 20px; } }
        .pillars-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
        @media (max-width: 768px) { .pillars-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }

        .bento-card:nth-child(6) { animation-delay: 0.7s; }
        .bento-card:hover { transform: translateY(-4px); border-color: #bcfe2f; }
        .bento-card.glow-bg { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); position: relative; }
        .bento-card.glow-bg::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(188, 254, 47, 0.08), transparent); animation: rotate-glow 12s linear infinite; pointer-events: none; }
        @keyframes rotate-glow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .bento-card.moss { background: #1a2e0a; border: 1px solid rgba(188, 254, 47, 0.3); }
        .bento-card.cocoa { background: #2a1f1a; border: 1px solid rgba(245, 166, 35, 0.2); }
        .bento-card.tan { background: #2a241a; border: 1px solid rgba(188, 254, 47, 0.15); }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .card-icon { font-size: 1.8rem; filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.3)); }
        .card-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #bcfe2f; display: flex; align-items: center; gap: 6px; }
        .card-value { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
        .card-sub { font-size: 0.75rem; color: #8a8a8a; line-height: 1.4; }
        .verdict-text { font-size: 0.9rem; line-height: 1.5; color: #e8e8e8; margin-top: 12px; font-weight: 400; }
        canvas { max-height: 160px; width: 100% !important; }
        
        /* Single tooltip system */
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: #2a2a2a;
            color: #bcfe2f;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 6px;
            position: relative;
        }
        
        .info-icon:hover {
            background: #bcfe2f;
            color: #050505;
        }
        
        /* Simple tooltip - no double */
        .info-icon[data-tooltip]:before {
            content: attr(data-tooltip);
            position: fixed;
            background: #1a1a1a;
            color: #bcfe2f;
            font-size: 0.65rem;
            padding: 8px 12px;
            border-radius: 10px;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid #bcfe2f;
            white-space: normal;
            max-width: 250px;
            text-align: center;
            line-height: 1.3;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        
        .info-icon:hover:before {
            opacity: 1;
            visibility: visible;
        }
        
        .progress-bar { width: 100%; height: 4px; background: #2a2a2a; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #bcfe2f; border-radius: 2px; transition: width 0.5s ease; }
        .participant-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; }
        .participant-name { font-size: 0.8rem; font-weight: 500; }
        .participant-value { font-size: 0.7rem; color: #bcfe2f; font-family: monospace; }
        .keyword-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .keyword { background: #1a1a1a; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #e8e8e8; cursor: pointer; transition: all 0.2s; border: 1px solid #2a2a2a; }
        .keyword:hover { background: #bcfe2f; color: #050505; }
        .insight-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
        .status { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 16px; margin-bottom: 24px; text-align: center; }
        .spinner { width: 20px; height: 20px; border: 2px solid #2a2a2a; border-top-color: #bcfe2f; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050505; }
        .landing.hide { display: none; }
        .dashboard { display: none; }
        .dashboard.show { display: block; }
        .footer { text-align: center; padding: 40px 0 20px; font-size: 0.65rem; color: #4a4a4a; border-top: 1px solid #1a1a1a; margin-top: 40px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; margin: 20px 0; }
        .emoji-item { text-align: center; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 16px; transition: all 0.2s; }
        .emoji-item:hover { background: rgba(188, 254, 47, 0.1); transform: scale(1.02); }
        .emoji-char { font-size: 2rem; }
        .emoji-name { font-size: 0.7rem; color: #bcfe2f; margin-top: 6px; }
        .emoji-count { font-size: 0.6rem; color: #8a8a8a; margin-top: 4px; }
        .stats-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(188, 254, 47, 0.1); text-align: center; }
        .stat-footer-item { text-align: center; }
        .stat-footer-label { font-size: 0.65rem; color: #bcfe2f; letter-spacing: 0.5px; text-transform: uppercase; }
        .stat-footer-value { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
        .player-card-dark { background: #111318; border-radius: 24px; padding: 24px 28px; border: 1px solid #2a2d36; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        @media (max-width: 768px) { .player-card-dark { padding: 20px; } }
        .player-name-dark { font-size: 1.4rem; font-weight: 700; color: #bcfe2f; margin-bottom: 16px; letter-spacing: -0.02em; border-left: 4px solid #bcfe2f; padding-left: 16px; }
        .player-stats-grid-dark { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .player-stat-dark { text-align: left; }
        .player-stat-label-dark { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; margin-bottom: 6px; }
        .player-stat-value-dark { font-size: 1.3rem; font-weight: 700; color: #f0f6fc; }
        @media (max-width: 600px) { .players-row { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>
<div class="bg-curve"></div>

<div class="landing" id="landingPage">
    <div class="container" style="width: 100%;">
        <div class="hero">
            <div class="hero-left">
                <h1>LORE</h1>
                <p class="tagline">Digital Archaeology — excavate the hidden story buried in your conversations.</p>
                <div class="badge-row">
                    <span class="badge">VIBE</span>
                    <span class="badge">FLOW</span>
                    <span class="badge">HYPE</span>
                    <span class="badge">SLANG</span>
                </div>
                <button class="cta-btn" id="startBtn">⟳ DROP THE LORE</button>
            </div>
            <div class="hero-right">
                <div class="data-leaf"></div>
            </div>
        </div>
    </div>
</div>

<div class="dashboard" id="dashboardPage">
    <div class="container">
        <div id="statusContainer"></div>
        <div id="globalFilterContainer" style="display: none;"></div>
        <div id="dashboardContent"></div>
        <div class="footer">🔒 all insights generated locally — your data never leaves your device</div>
    </div>
</div>

<div class="calendar-modal" id="calendarModal">
    <div class="calendar-card">
        <div class="calendar-title">SELECT DATE RANGE</div>
        <div class="calendar-input-group">
            <label>START DATE</label>
            <input type="date" id="calendarStart">
        </div>
        <div class="calendar-input-group">
            <label>END DATE</label>
            <input type="date" id="calendarEnd">
        </div>
        <div class="calendar-error" id="calendarError">END DATE MUST BE AFTER START DATE</div>
        <div class="calendar-buttons">
            <button class="calendar-btn" id="calendarCancel">CANCEL</button>
            <button class="calendar-btn primary" id="calendarApply">APPLY</button>
        </div>
    </div>
</div>

<script>
    // ========== UTILITY FUNCTIONS ==========
    function cleanText(t) { return t.replace(/[\u200e\u200f\u202a\u202b\u202c\u202d\u202e]/g, '').trim(); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    
    function formatMonthLabel(monthStr) {
        const [year, month] = monthStr.split('-');
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${monthNames[parseInt(month)-1]}'${year.slice(-2)}`;
    }
    
    // ========== SENTIMENT ANALYSIS ==========
    function analyzeSentimentFast(text) {
        let score = 58; // raised base from 50 → 58 (neutral leans positive)
        const lower = text.toLowerCase();
        if (/(good|great|awesome|amazing|fantastic|wonderful|brilliant|excellent|perfect|beautiful|lovely|sweet|nice|happy|glad|joy|love|thanks|thank|proud|congrats|fun|cool|yes|yeah|yay|vibes|epic|legendary|success)/i.test(lower)) score += 20;
        if (/(bad|terrible|horrible|awful|hate|angry|mad|annoying|frustrated|sad|unhappy|miserable|disappointed|sorry|stressed|cringe|lame|trash|ugh|meh)/i.test(lower)) score -= 8; // unchanged
        if (lower.includes('love you') || lower.includes('i love')) score += 18;
        else if (lower.includes('thank you')) score += 12;
        const exclaim = (text.match(/!/g) || []).length;
        score += Math.min(exclaim * 3, 10);
        if (/[😊😃😄🥰😍🤩❤️🔥👍👏🥳🏆]/i.test(text)) score += 12;
        if (/[😠😡💀😤😞😢😭💔]/i.test(text)) score -= 5;
        if (/lol|lmao|haha/i.test(lower)) score += 10;
        return Math.max(20, Math.min(98, score));
    }
    
    function calcEnergyFast(text) {
        let energy = 50;
        if (text === text.toUpperCase() && text.length > 4) energy += 18;
        energy += Math.min((text.match(/!/g) || []).length * 6, 20);
        if (/lol|lmao|haha/i.test(text)) energy += 12;
        if (/(OMG|WOW|YES|LET'S GO)/i.test(text)) energy += 12;
        return Math.min(98, Math.max(32, energy));
    }
    
    function detectTopicsFast(text) {
        const lower = text.toLowerCase();
        if (/\b(work|office|meeting|deadline|project|job|career)\b/i.test(lower)) return 'work';
        if (/\b(family|friend|home|weekend|vacation|travel|movie|show|book|music)\b/i.test(lower)) return 'personal';
        if (/\b(lol|haha|lmao|hilarious|funny|joke|meme|fun)\b/i.test(lower)) return 'humor';
        if (/\b(ugh|annoying|frustrated|stressed|tired|hate)\b/i.test(lower)) return 'venting';
        if (/\b(meet|call|schedule|plan|tomorrow|later|today)\b/i.test(lower)) return 'planning';
        if (/\b(thanks|appreciate|help|support|proud|congrats|hope)\b/i.test(lower)) return 'support';
        return null;
    }
    
    function parseWhatsAppFast(text) {
        const lines = text.split(/\r?\n/);
        const messages = [];
        // Pattern 1: [dd/mm/yy, hh:mm:ss AM/PM] Sender: message  (bracket format)
        const pattern = /\[(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2}:\d{2})\s?([AP]M)?\]\s([^:]+):\s(.*)/i;
        // Pattern 2: dd/mm/yy, hh:mm - Sender: message  (dash format, no brackets)
        const pattern2 = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2})(?::\d{2})?\s?([AP]M)?\s[-–]\s([^:]+):\s(.*)/i;
        let current = null;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!line.trim()) continue;
            if (/end-to-end encrypted|security code|deleted/i.test(line)) continue;
            const match = line.match(pattern) || line.match(pattern2);
            if (match) {
                if (current) messages.push(current);
                let [, dateStr, timeStr, ampm, sender, message] = match;
                sender = cleanText(sender);
                message = cleanText(message);
                let timestamp = new Date();
                try {
                    let [d, m, y] = dateStr.split('/');
                    let [h, min, sec] = timeStr.split(':');
                    let hour = parseInt(h);
                    if (ampm && ampm.toUpperCase() === 'PM' && hour < 12) hour += 12;
                    if (ampm && ampm.toUpperCase() === 'AM' && hour === 12) hour = 0;
                    timestamp = new Date(2000 + parseInt(y), parseInt(m) - 1, parseInt(d), hour, parseInt(min), parseInt(sec));
                } catch(e) {}
                current = { 
                    sender: sender, 
                    message: message, 
                    length: message.length, 
                    timestamp: timestamp, 
                    hour: timestamp.getHours(), 
                    date: timestamp.toISOString().split('T')[0],
                    timestampObj: timestamp 
                };
            } else if (current) {
                current.message += ' ' + cleanText(line);
                current.length = current.message.length;
            }
        }
        if (current) messages.push(current);
        return messages;
    }
    
    let fullMessages = null;
    let allDates = [];
    let currentDateFilter = { startIdx: 0, endIdx: null };
    let charts = {};
    
    const stopwordsSet = new Set([
        'the','and','for','that','this','with','from','have','are','was','were','but','not','you','they','she','he','it','we',
        'like','just','what','when','where','how','get','got','all','can','will','image','video','photo','gif','sticker',
        'media','omitted','edited','then','them','out','about','into','through','during','before','after','above','below'
    ]);
    
    function computeStatsFast(messages) {
        const total = messages.length;
        if (total === 0) return null;
        
        const senders = [];
        const senderMap = new Map();
        
        let totalSentiment = 0;
        let totalEnergy = 0;
        const topicCounts = new Map();
        const hourCounts = new Array(24).fill(0);
        const nightMsgsBySender = new Map();
        const totalBySender = new Map();
        const keywords = new Map();
        const vocabMap = new Map();
        
        for (let i = 0; i < messages.length; i++) {
            const m = messages[i];
            const sentiment = analyzeSentimentFast(m.message);
            const energy = calcEnergyFast(m.message);
            const topic = detectTopicsFast(m.message);
            
            m.sentiment = sentiment; // FIX: store on message so timeline chart can read it
            totalSentiment += sentiment;
            totalEnergy += energy;
            
            if (!senderMap.has(m.sender)) {
                senderMap.set(m.sender, { count: 0, sentiment: 0, energy: 0 });
                vocabMap.set(m.sender, new Set());
                senders.push(m.sender);
            }
            const senderData = senderMap.get(m.sender);
            senderData.count++;
            senderData.sentiment += sentiment;
            senderData.energy += energy;
            
            const words = m.message.toLowerCase().match(/\b[a-z]{4,}\b/g);
            if (words) {
                const vocabSet = vocabMap.get(m.sender);
                for (let w of words) {
                    if (!stopwordsSet.has(w) && w.length > 3) {
                        vocabSet.add(w);
                    }
                }
            }
            
            if (topic) topicCounts.set(topic, (topicCounts.get(topic) || 0) + 1);
            
            hourCounts[m.hour]++;
            
            if (m.hour >= 0 && m.hour < 5) {
                nightMsgsBySender.set(m.sender, (nightMsgsBySender.get(m.sender) || 0) + 1);
            }
            totalBySender.set(m.sender, (totalBySender.get(m.sender) || 0) + 1);
            
            const slangWords = m.message.toLowerCase().match(/\b[a-z]{3,}\b/g);
            if (slangWords) {
                for (let w of slangWords) {
                    if (!stopwordsSet.has(w) && w.length > 2 && !/\d/.test(w)) {
                        keywords.set(w, (keywords.get(w) || 0) + 1);
                    }
                }
            }
        }
        
        const avgSentiment = totalSentiment / total;
        const avgEnergy = totalEnergy / total;
        const hypeScore = avgEnergy.toFixed(1);
        
        let energyLevel = "mid-energy";
        if (avgEnergy > 55) energyLevel = "high-energy 🔥";
        else if (avgEnergy > 35) energyLevel = "steady pulse";
        else energyLevel = "low-key";
        
        let vibeText = "neutral vibe";
        if (avgSentiment > 72) vibeText = "radiant ✨";
        else if (avgSentiment > 62) vibeText = "positive 🌞";
        else if (avgSentiment > 54) vibeText = "mildly positive";
        else if (avgSentiment < 40) vibeText = "heavy 🌧️";
        
        const topTopics = Array.from(topicCounts.entries()).sort((a,b) => b[1] - a[1]).slice(0, 3);
        
        const airTimePct = {};
        for (let [s, data] of senderMap) {
            airTimePct[s] = Math.round((data.count / total) * 100);
        }
        
        const pctValues = Object.values(airTimePct);
        const idealBalance = 100 / pctValues.length;
        let balanceScore = 100;
        for (let pct of pctValues) {
            balanceScore -= Math.abs(pct - idealBalance) * 0.8;
        }
        balanceScore = Math.max(0, Math.min(100, Math.round(balanceScore)));
        let balanceLabel = "balanced";
        if (balanceScore < 40) balanceLabel = "one-sided";
        else if (balanceScore < 70) balanceLabel = "moderately balanced";
        else balanceLabel = "well balanced";
        
        const sorted = [...messages].sort((a,b) => a.timestamp - b.timestamp);
        
        let responseSum = 0, responseCount = 0;
        let firstResponseSum = 0, firstResponseCount = 0;
        let fastestTime = Infinity, fastestResponder = "N/A";
        let firstFastestTime = Infinity, fastestFirstResponder = null;
        
        for (let i = 1; i < sorted.length; i++) {
            if (sorted[i].sender !== sorted[i-1].sender) {
                const delta = (sorted[i].timestamp - sorted[i-1].timestamp) / 60000;
                if (delta > 0 && delta < 720) {
                    responseSum += delta;
                    responseCount++;
                    if (delta < 60) {
                        firstResponseSum += delta;
                        firstResponseCount++;
                        if (delta < firstFastestTime) {
                            firstFastestTime = delta;
                            fastestFirstResponder = sorted[i].sender;
                        }
                    }
                    if (delta < fastestTime && delta < 60) {
                        fastestTime = delta;
                        fastestResponder = sorted[i].sender;
                    }
                }
            }
        }
        const avgResponseTime = responseCount > 0 ? Math.round(responseSum / responseCount) : 0;
        const avgFirstResponse = firstResponseCount > 0 ? Math.round(firstResponseSum / firstResponseCount) : 0;
        
        const initiations = new Map();
        let lastTime = null;
        for (let m of sorted) {
            if (lastTime && (m.timestamp - lastTime) > 21600000) {
                initiations.set(m.sender, (initiations.get(m.sender) || 0) + 1);
            }
            lastTime = m.timestamp;
        }
        let initiator = "mixed";
        let initiatorCount = 0;
        if (initiations.size > 0) {
            const topInitiator = Array.from(initiations.entries()).sort((a,b) => b[1] - a[1])[0];
            initiator = topInitiator[0];
            initiatorCount = topInitiator[1];
        }
        
        const nightOwls = {};
        for (let [s, count] of nightMsgsBySender) {
            const totalS = totalBySender.get(s) || 1;
            nightOwls[s] = ((count / totalS) * 100).toFixed(1);
        }
        const topNightOwl = Object.entries(nightOwls).sort((a,b) => parseFloat(b[1]) - parseFloat(a[1]))[0];
        
        const doubleText = new Map();
        for (let i = 1; i < sorted.length; i++) {
            if (sorted[i].sender === sorted[i-1].sender) {
                doubleText.set(sorted[i].sender, (doubleText.get(sorted[i].sender) || 0) + 1);
            }
        }
        const doubleTextRatio = {};
        for (let [s, count] of doubleText) {
            const totalS = totalBySender.get(s) || 1;
            doubleTextRatio[s] = ((count / totalS) * 100).toFixed(1);
        }
        
        const days = new Map();
        for (let m of sorted) {
            if (!days.has(m.date) || m.timestamp > days.get(m.date).timestamp) {
                days.set(m.date, m);
            }
        }
        const closers = new Map();
        for (let m of days.values()) {
            closers.set(m.sender, (closers.get(m.sender) || 0) + 1);
        }
        
        const topKeywords = Array.from(keywords.entries()).sort((a,b) => b[1] - a[1]).slice(0, 15);
        
        // BUILD TIMELINE DATA FOR CHART - THIS IS CRITICAL
        const monthlySentiment = new Map();
        for (let m of messages) {
            if (!m.timestampObj) continue;
            const key = `${m.timestampObj.getFullYear()}-${String(m.timestampObj.getMonth() + 1).padStart(2, '0')}`;
            if (!monthlySentiment.has(key)) monthlySentiment.set(key, []);
            monthlySentiment.get(key).push(m.sentiment);
        }
        const timelineData = Array.from(monthlySentiment.entries()).sort().map(([k, v]) => ({ 
            month: k, 
            avg: v.reduce((a,b) => a+b,0) / v.length
        }));
        
        const half = Math.floor(timelineData.length / 2);
        const firstHalfAvg = timelineData.slice(0, half).reduce((a,b) => a + b.avg, 0) / (half || 1);
        const secondHalfAvg = timelineData.slice(half).reduce((a,b) => a + b.avg, 0) / (timelineData.length - half || 1);
        const trend = secondHalfAvg - firstHalfAvg;
        let trendDesc = "stable";
        if (trend > 6) trendDesc = "improving 📈";
        else if (trend < -6) trendDesc = "declining 📉";
        
        let mostActiveHour = 0;
        for (let h = 0; h < 24; h++) if (hourCounts[h] > hourCounts[mostActiveHour]) mostActiveHour = h;
        
        const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}]/gu;
        const signatureEmojis = {};
        const perPersonEmojiCounts = {};
        for (let s of senders) {
            const emojiFreq = new Map();
            for (let m of messages) {
                if (m.sender === s) {
                    const matches = m.message.match(emojiRegex);
                    if (matches) {
                        for (let e of matches) {
                            emojiFreq.set(e, (emojiFreq.get(e) || 0) + 1);
                        }
                    }
                }
            }
            if (emojiFreq.size > 0) {
                const top = Array.from(emojiFreq.entries()).sort((a,b) => b[1] - a[1])[0];
                signatureEmojis[s] = top[0];
                perPersonEmojiCounts[s] = top[1];
            } else {
                signatureEmojis[s] = '—';
                perPersonEmojiCounts[s] = 0;
            }
        }
        
        const senderStats = {};
        for (let [s, data] of senderMap) {
            senderStats[s] = {
                count: data.count,
                pct: Math.round((data.count / total) * 100),
                sentiment: Math.round(data.sentiment / data.count),
                vocab: vocabMap.get(s)?.size || 0,
                energy: Math.round(data.energy / data.count)
            };
        }
        
        let verdict = "";
        if (avgSentiment > 78) verdict = "This conversation radiates extraordinary warmth and joy — a truly special, uplifting space where people feel deeply heard and valued. Keep nurturing this — it's rare and precious.";
        else if (avgSentiment > 65) verdict = "Generally positive with genuine moments of connection. A healthy balance of support, laughter, and real talk. There's a solid emotional foundation here.";
        else if (avgSentiment > 52) verdict = "Balanced and grounded. A mix of good days and tough conversations — feels authentically human. Real relationships have texture.";
        else if (avgSentiment > 42) verdict = "There's some weight here, but also moments of warmth. The conversation has its share of difficult moments, but that's part of being real with each other.";
        else verdict = "The data suggests some emotional heaviness, but there are also signals of care beneath the surface. Small gestures of warmth can shift the weather.";
        
        return {
            total, avgSentiment: Math.round(avgSentiment), hypeScore, energyLevel, vibeText, trendDesc,
            avgResponseTime, fastestResponder, initiator, initiatorCount, nightOwls, topNightOwl,
            doubleTextRatio, airTimePct, closers: Object.fromEntries(closers), topKeywords, 
            timelineData: timelineData,  // MAKE SURE THIS IS INCLUDED
            signatureEmojis, perPersonEmojiCounts, mostActiveHour, verdict, topTopics,
            balanceScore, balanceLabel, fastestFirstResponder: fastestFirstResponder ? [fastestFirstResponder, avgFirstResponse] : null,
            senderStats
        };
    }

    startBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.txt';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file && file.name.endsWith('.txt')) {
                landingPage.classList.add('hide');
                dashboardPage.classList.add('show');
                showStatus('📖 excavating artifacts...', 'loading');
                const text = await file.text();
                showStatus('📊 decoding conversation strata...', 'loading');
                setTimeout(() => {
                    fullMessages = parseWhatsAppFast(text);
                    if (fullMessages.length === 0) { showStatus('❌ could not parse messages. check file format.', 'error'); return; }
                    allDates = [...new Set(fullMessages.map(m => m.date))].sort();
                    currentDateFilter = { startIdx: 0, endIdx: allDates.length - 1 };
                    updateFilteredReport();
                    showStatus('✅ excavation complete — lore unearthed', 'success');
                    setTimeout(() => { document.getElementById('statusContainer').innerHTML = ''; }, 2000);
                }, 10);
            } else alert('please select a WhatsApp .txt export');
        };
        input.click();
    });
    
    function updateFilteredReport() {
        const startDate = allDates[currentDateFilter.startIdx];
        const endDate = allDates[currentDateFilter.endIdx];
        const filteredMessages = fullMessages.filter(m => m.date >= startDate && m.date <= endDate);
        currentReport = computeStatsFast(filteredMessages);
        renderDashboard(currentReport);
        renderGlobalFilter();
    }
    
    function renderGlobalFilter() {
        const container = document.getElementById('globalFilterContainer');
        if (!allDates.length) return;
        
        function formatDateShort(dateStr) {
            const [y,m,d] = dateStr.split('-');
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${monthNames[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
        }
        
        const startDate = allDates[currentDateFilter.startIdx];
        const endDate = allDates[currentDateFilter.endIdx];
        
        container.style.display = 'block';
        container.innerHTML = `
            <div class="global-filter">
                <div class="filter-label">
                    <span class="info-icon" data-tooltip="FILTER ALL INSIGHTS BY DATE RANGE — CONTROLS THE EXCAVATION DEPTH">i</span>
                    Excavation Depth
                </div>
                <div class="slider-wrapper">
                    <div class="double-slider" id="doubleSlider">
                        <div class="slider-track-fill" id="sliderFill"></div>
                        <input type="range" id="startSlider" min="0" max="${allDates.length-1}" value="${currentDateFilter.startIdx}" step="1">
                        <input type="range" id="endSlider" min="0" max="${allDates.length-1}" value="${currentDateFilter.endIdx}" step="1">
                    </div>
                </div>
                <div class="date-controls">
                    <div class="date-range-display" id="globalDateRange">${formatDateShort(startDate)} → ${formatDateShort(endDate)}</div>
                    <button class="date-picker-btn" id="calendarBtn">📅 select</button>
                </div>
            </div>
        `;
        
        function updateSliderFill() {
            const start = parseInt(document.getElementById('startSlider').value);
            const end = parseInt(document.getElementById('endSlider').value);
            const total = allDates.length - 1;
            const leftPercent = (start / total) * 100;
            const rightPercent = ((total - end) / total) * 100;
            const fill = document.getElementById('sliderFill');
            if (fill) fill.style.left = `${leftPercent}%`;
            if (fill) fill.style.right = `${rightPercent}%`;
        }
        
        const startSlider = document.getElementById('startSlider');
        const endSlider = document.getElementById('endSlider');
        const globalDateRange = document.getElementById('globalDateRange');
        
        function updateFromSliders() {
            let start = parseInt(startSlider.value);
            let end = parseInt(endSlider.value);
            if (start > end) { start = end; startSlider.value = start; }
            if (end < start) { end = start; endSlider.value = end; }
            currentDateFilter.startIdx = start;
            currentDateFilter.endIdx = end;
            const sDate = allDates[start];
            const eDate = allDates[end];
            globalDateRange.innerHTML = `${formatDateShort(sDate)} → ${formatDateShort(eDate)}`;
            updateSliderFill();
            updateFilteredReport();
        }
        
        startSlider.oninput = updateFromSliders;
        endSlider.oninput = updateFromSliders;
        updateSliderFill();
        
        const calendarBtn = document.getElementById('calendarBtn');
        const startDateObj = new Date(startDate);
        const endDateObj = new Date(endDate);
        calendarStart.value = startDateObj.toISOString().split('T')[0];
        calendarEnd.value = endDateObj.toISOString().split('T')[0];
        calendarBtn.onclick = () => { calendarModal.classList.add('show'); };
    }
    
    calendarCancel.onclick = () => { calendarModal.classList.remove('show'); calendarError.style.display = 'none'; };
    calendarApply.onclick = () => {
        const startDateStr = calendarStart.value;
        const endDateStr = calendarEnd.value;
        if (!startDateStr || !endDateStr) { calendarError.style.display = 'block'; calendarError.innerText = 'PLEASE SELECT BOTH DATES'; return; }
        if (startDateStr > endDateStr) { calendarError.style.display = 'block'; calendarError.innerText = 'END DATE MUST BE AFTER START DATE'; return; }
        let startIdx = 0, endIdx = allDates.length - 1;
        for (let i = 0; i < allDates.length; i++) { if (allDates[i] >= startDateStr) { startIdx = i; break; } }
        for (let i = allDates.length - 1; i >= 0; i--) { if (allDates[i] <= endDateStr) { endIdx = i; break; } }
        if (startIdx > endIdx) { calendarError.style.display = 'block'; calendarError.innerText = 'NO MESSAGES IN SELECTED DATE RANGE'; return; }
        currentDateFilter.startIdx = startIdx;
        currentDateFilter.endIdx = endIdx;
        calendarModal.classList.remove('show');
        calendarError.style.display = 'none';
        updateFilteredReport();
    };

        } else {
            c.innerHTML = `<div class="status" style="border-color:#f5a623; color:#f5a623;">❌ ${msg}</div>`;
        }
    }

                <div class="bento-card glow-bg"><div class="card-header"><div class="card-icon">🌡️</div><div class="card-title">mood weather <span class="info-icon" data-tooltip="SENTIMENT OVER TIME">i</span></div></div><div class="card-value">${r.vibeText}</div><canvas id="timelineChart" style="height:160px; width:100%"></canvas><div class="card-sub">trend: ${r.trendDesc} · ${r.timelineData.length} months</div></div>
                
                <div class="bento-card moss"><div class="card-header"><div class="card-icon">⭐</div><div class="card-title">the initiator <span class="info-icon" data-tooltip="BREAKS SILENCE AFTER 6+ HOURS">i</span></div></div><div class="card-value">${r.initiator}</div><div class="card-sub">${r.initiatorCount} resurrections</div><div class="insight-row"><span class="participant-name">⚡ fastest responder</span><span class="participant-value">${r.fastestResponder}</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${Object.values(r.doubleTextRatio)[0] || 0}%;"></div></div><div class="participant-item"><span class="participant-name">double-text</span><span class="participant-value">${Object.values(r.doubleTextRatio)[0] || 0}%</span></div></div>
                
                <div class="bento-card cocoa"><div class="card-header"><div class="card-icon">🌙</div><div class="card-title">night owl <span class="info-icon" data-tooltip="MESSAGES AFTER MIDNIGHT - HIGHEST FIRST">i</span></div></div><div class="card-value">${nightOwlEntries[0] ? nightOwlEntries[0][0] : 'nobody'}</div><div class="card-sub">${nightOwlEntries[0] ? nightOwlEntries[0][1] : 0}% after midnight</div>${nightOwlEntries.slice(0, 3).map(([n, v]) => `<div class="progress-bar"><div class="progress-fill" style="width: ${v}%;"></div></div><div class="participant-item"><span>${n}</span><span>${v}%</span></div>`).join('')}</div>
                
                <div class="bento-card"><div class="card-header"><div class="card-icon">🎙️</div><div class="card-title">air time <span class="info-icon" data-tooltip="CONVERSATION VOLUME - HIGHEST FIRST">i</span></div></div>${airTimeEntries.map(([n, v]) => `<div class="participant-item"><span>${n}</span><span>${v}%</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${v}%;"></div></div>`).join('')}</div>
                
                <div class="bento-card"><div class="card-header"><div class="card-icon">🏆</div><div class="card-title">closer award <span class="info-icon" data-tooltip="LAST MESSAGE OF EACH DAY - HIGHEST FIRST">i</span></div></div>${closerEntries.slice(0, 3).map(([n, c]) => `<div class="participant-item"><span>${n}</span><span>${c} days</span></div>`).join('')}<div class="insight-row"><span>⏰ most active hour</span><span>${r.mostActiveHour}:00</span></div></div>
                
                <div class="bento-card tan"><div class="card-header"><div class="card-icon">📜</div><div class="card-title">the verdict <span class="info-icon" data-tooltip="EMOTIONAL SUMMARY">i</span></div></div><div class="verdict-text">${r.verdict}</div><div class="keyword-cloud">${r.topKeywords.slice(0, 8).map(([w, c]) => `<span class="keyword">${w} (${c})</span>`).join('')}</div></div>
            </div>
            
            <div class="pillars-container"><div class="pillars-grid" style="grid-template-columns: repeat(4, 1fr);">
                <div class="pillar-card"><div class="pillar-icon">💡</div><div class="pillar-title">top topics</div><div class="pillar-value" style="font-size: 1rem;">${r.topTopics.map(t => t[0].charAt(0).toUpperCase() + t[0].slice(1)).join(', ') || 'various'}</div><div class="pillar-sub">main themes</div></div>
                <div class="pillar-card"><div class="pillar-icon">⚡</div><div class="pillar-title">first response</div><div class="pillar-value" style="font-size: 1.2rem;">${firstResponseText}</div><div class="pillar-sub">${firstResponseValue}</div></div>
                <div class="pillar-card"><div class="pillar-icon">⚖️</div><div class="pillar-title">balance score</div><div class="pillar-value">${r.balanceScore}%</div><div class="pillar-sub">${r.balanceLabel}</div></div>
                <div class="pillar-card"><div class="pillar-icon">🎭</div><div class="pillar-title">dominant emotion</div><div class="pillar-value" style="font-size: 1rem;">${dominantEmotionLabel}</div><div class="pillar-sub">${dominantEmotionEmoji} overall</div></div>
            </div></div>
            
            <div class="pillars-container"><div class="emoji-grid">${Object.entries(r.signatureEmojis).map(([name, emoji]) => `<div class="emoji-item"><div class="emoji-char">${emoji}</div><div class="emoji-name">${name}</div><div class="emoji-count">${r.perPersonEmojiCounts[name] || 0}</div></div>`).join('')}</div><div class="stats-footer"><div class="stat-footer-item"><div class="stat-footer-label">📬 total</div><div class="stat-footer-value">${r.total.toLocaleString()}</div></div><div class="stat-footer-item"><div class="stat-footer-label">👥 people</div><div class="stat-footer-value">${Object.keys(r.senderStats).length}</div></div><div class="stat-footer-item"><div class="stat-footer-label">🏷️ top</div><div class="stat-footer-value">"${r.topKeywords[0]?.[0] || '—'}"</div></div></div></div>
        `;
        
        // CREATE CHART AFTER DOM IS READY
        setTimeout(() => {
            const canvas = document.getElementById('timelineChart');
            
            if (canvas && r.timelineData && r.timelineData.length > 0) {
                // Destroy any existing chart on this canvas to avoid "Canvas already in use" errors
                const existingChart = Chart.getChart(canvas);
                if (existingChart) existingChart.destroy();
                
                const ctx = canvas.getContext('2d');
                const labels = r.timelineData.map(d => formatMonthLabel(d.month));
                const data = r.timelineData.map(d => d.avg);
                
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'sentiment',
                            data: data,
                            borderColor: '#bcfe2f',
                            backgroundColor: 'rgba(188,254,47,0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 4,
                            pointBackgroundColor: '#bcfe2f',
                            pointBorderColor: '#1a1a1a',
                            pointBorderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `Sentiment: ${Math.round(context.raw)}%`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                grid: { color: '#2a2a2a' },
                                ticks: { color: '#8a8a8a', callback: function(val) { return val + '%'; } }
                            },
                            x: {
                                ticks: { color: '#8a8a8a', font: { size: 9 } }
                            }
                        }
                    }
                });
            } else {
                // No timeline data available — chart section stays empty
            }
        }, 200);
    }
</script>
</body>
</html>
