<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LORE — Digital Archaeology</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: #050505;
            color: #e8e8e8;
            overflow-x: hidden;
        }
        
        :root {
            --onyx: #050505;
            --moss: #bcfe2f;
            --taupe: #2a2a2a;
            --peach: #f5a623;
        }
        
        .bg-curve {
            position: fixed;
            top: 0;
            right: 0;
            width: 60%;
            height: 80vh;
            background: radial-gradient(ellipse at 70% 30%, rgba(188, 254, 47, 0.08), transparent 60%);
            z-index: 0;
            pointer-events: none;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 48px;
            position: relative;
            z-index: 2;
        }
        
        @media (max-width: 768px) { .container { padding: 24px 20px; } }
        
        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 60px;
            align-items: center;
        }
        
        @media (max-width: 768px) { .hero { grid-template-columns: 1fr; gap: 40px; text-align: center; } }
        
        .hero-left h1 {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #bcfe2f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        
        .hero-left .tagline {
            font-size: 1rem;
            color: #8a8a8a;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        
        .badge-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .badge {
            background: rgba(188, 254, 47, 0.08);
            border: 1px solid rgba(188, 254, 47, 0.2);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #bcfe2f;
        }
        
        .cta-btn {
            background: linear-gradient(135deg, #f5a623, #e8951a);
            color: #050505;
            border: none;
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.3);
            animation: pulse-glow 2s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(245, 166, 35, 0.3); }
            50% { box-shadow: 0 0 40px rgba(245, 166, 35, 0.6); }
        }
        
        .cta-btn:hover { transform: translateY(-2px); }
        
        .data-leaf {
            position: relative;
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, rgba(188, 254, 47, 0.1), rgba(188, 254, 47, 0.02));
            border-radius: 60% 40% 50% 50% / 40% 50% 50% 60%;
            animation: float-leaf 6s ease-in-out infinite;
            margin: 0 auto;
        }
        
        @keyframes float-leaf {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        
        .data-leaf::before {
            content: '💬';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            opacity: 0.8;
        }
        
        /* Global Date Filter */
        .global-filter {
            background: rgba(42, 42, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(188, 254, 47, 0.15);
            border-radius: 60px;
            padding: 12px 24px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .filter-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #bcfe2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-wrapper {
            flex: 1;
            min-width: 300px;
            position: relative;
            padding: 0 10px;
        }
        
        .double-slider {
            position: relative;
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            margin: 20px 0;
        }
        
        .slider-track-fill {
            position: absolute;
            height: 4px;
            background: #bcfe2f;
            border-radius: 2px;
            pointer-events: none;
        }
        
        input[type="range"] {
            position: absolute;
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: transparent;
            pointer-events: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #bcfe2f;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #050505;
            pointer-events: auto;
        }
        
        .date-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            padding: 6px 16px;
            border-radius: 40px;
        }
        
        .date-picker-btn {
            background: transparent;
            border: 1px solid rgba(188, 254, 47, 0.3);
            color: #bcfe2f;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        .date-picker-btn:hover { background: rgba(188, 254, 47, 0.1); }
        .date-range-display { font-size: 0.7rem; color: #bcfe2f; font-family: monospace; cursor: pointer; }
        
        /* Calendar Modal */
        .calendar-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .calendar-modal.show { display: flex; }
        
        .calendar-card {
            background: #1a1a1a;
            border: 1px solid #bcfe2f;
            border-radius: 24px;
            padding: 28px;
            width: 360px;
        }
        
        .calendar-title { font-size: 1rem; color: #bcfe2f; margin-bottom: 20px; text-align: center; }
        .calendar-input-group { margin-bottom: 20px; }
        .calendar-input-group label { font-size: 0.7rem; color: #8a8a8a; display: block; margin-bottom: 6px; }
        .calendar-input-group input {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 12px;
            color: #e8e8e8;
        }
        .calendar-error { color: #f5a623; font-size: 0.7rem; margin-top: 8px; display: none; }
        .calendar-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .calendar-btn {
            flex: 1;
            background: #2a2a2a;
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: #e8e8e8;
            cursor: pointer;
        }
        .calendar-btn.primary { background: #bcfe2f; color: #050505; font-weight: 600; }
        
        /* Pillars */
        .pillars-container {
            background: rgba(42, 42, 42, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(188, 254, 47, 0.15);
            border-radius: 28px;
            padding: 32px 40px;
            margin-bottom: 48px;
        }
        
        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px;
        }
        
        @media (max-width: 768px) { .pillars-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .pillar-card {
            text-align: center;
            transition: transform 0.3s ease;
            animation: fade-up 0.5s ease forwards;
            opacity: 0;
            position: relative;
        }
        
        .pillar-card:nth-child(1) { animation-delay: 0.1s; }
        .pillar-card:nth-child(2) { animation-delay: 0.2s; }
        .pillar-card:nth-child(3) { animation-delay: 0.3s; }
        .pillar-card:nth-child(4) { animation-delay: 0.4s; }
        
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pillar-card:hover { transform: translateY(-5px); }
        
        .pillar-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.3));
        }
        
        .pillar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #bcfe2f;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .pillar-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .pillar-sub { font-size: 0.7rem; color: #8a8a8a; }
        
        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 48px;
        }
        
        @media (max-width: 768px) { .bento-grid { grid-template-columns: 1fr; } }
        
        .bento-card {
            background: var(--taupe);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s ease;
            animation: fade-up 0.6s ease forwards;
            opacity: 0;
            position: relative;
            overflow: visible;
        }
        
        .bento-card:nth-child(1) { animation-delay: 0.2s; }
        .bento-card:nth-child(2) { animation-delay: 0.3s; }
        .bento-card:nth-child(3) { animation-delay: 0.4s; }
        .bento-card:nth-child(4) { animation-delay: 0.5s; }
        .bento-card:nth-child(5) { animation-delay: 0.6s; }
        .bento-card:nth-child(6) { animation-delay: 0.7s; }
        
        .bento-card:hover { transform: translateY(-4px); }
        
        .bento-card.glow-bg { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); position: relative; }
        .bento-card.glow-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(188, 254, 47, 0.08), transparent);
            animation: rotate-glow 12s linear infinite;
            pointer-events: none;
        }
        
        @keyframes rotate-glow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .bento-card.moss { background: #1a2e0a; border: 1px solid rgba(188, 254, 47, 0.3); }
        .bento-card.cocoa { background: #2a1f1a; border: 1px solid rgba(245, 166, 35, 0.2); }
        .bento-card.tan { background: #2a241a; border: 1px solid rgba(188, 254, 47, 0.15); }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .card-icon {
            font-size: 1.8rem;
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.3));
        }
        
        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #bcfe2f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .card-value {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .card-sub { font-size: 0.75rem; color: #8a8a8a; line-height: 1.4; }
        .verdict-text { font-size: 0.9rem; line-height: 1.5; color: #e8e8e8; margin-top: 12px; font-weight: 400; }
        
        canvas { max-height: 160px; width: 100% !important; }
        
        /* ALL CAPS Wrapped Tooltip */
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: #2a2a2a;
            color: #bcfe2f;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 700;
            cursor: help;
            margin-left: 6px;
            position: relative;
        }
        
        .info-icon:hover { background: #bcfe2f; color: #050505; }
        
        .info-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #bcfe2f;
            font-size: 0.65rem;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 10px;
            width: 220px;
            text-align: center;
            border: 1px solid #bcfe2f;
            z-index: 1000;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            font-family: 'Outfit', monospace;
            line-height: 1.3;
            pointer-events: none;
            white-space: normal;
            word-wrap: break-word;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        
        .info-icon:hover .info-tooltip {
            visibility: visible;
            opacity: 1;
        }
        
        /* Progress Bar */
        .progress-bar { width: 100%; height: 4px; background: #2a2a2a; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #bcfe2f; border-radius: 2px; transition: width 0.5s ease; }
        
        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .participant-name { font-size: 0.8rem; font-weight: 500; }
        .participant-value { font-size: 0.7rem; color: #bcfe2f; font-family: monospace; }
        
        .keyword-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .keyword {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #e8e8e8;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2a2a2a;
        }
        .keyword:hover { background: #bcfe2f; color: #050505; }
        
        .insight-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .status {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #2a2a2a;
            border-top-color: #bcfe2f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050505; }
        .landing.hide { display: none; }
        .dashboard { display: none; }
        .dashboard.show { display: block; }
        
        .footer {
            text-align: center;
            padding: 40px 0 20px;
            font-size: 0.65rem;
            color: #4a4a4a;
            border-top: 1px solid #1a1a1a;
            margin-top: 40px;
        }
        
        /* Emoji Grid */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        
        .emoji-item {
            text-align: center;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            transition: all 0.2s;
        }
        
        .emoji-item:hover { background: rgba(188, 254, 47, 0.1); transform: scale(1.02); }
        
        .emoji-char { font-size: 2rem; }
        .emoji-name { font-size: 0.7rem; color: #bcfe2f; margin-top: 6px; }
        .emoji-count { font-size: 0.6rem; color: #8a8a8a; margin-top: 4px; }
        
        .stats-footer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(188, 254, 47, 0.1);
            text-align: center;
        }
        
        .stat-footer-item { text-align: center; }
        .stat-footer-label { font-size: 0.65rem; color: #bcfe2f; letter-spacing: 0.5px; text-transform: uppercase; }
        .stat-footer-value { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
        
        /* Emotion Badges */
        .emotion-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin: 4px;
        }
        .emotion-joy { background: rgba(188, 254, 47, 0.2); color: #bcfe2f; }
        .emotion-sadness { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
        .emotion-excitement { background: rgba(245, 166, 35, 0.2); color: #f5a623; }
        .emotion-anger { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .emotion-anxiety { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .emotion-surprise { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    </style>
</head>
<body>
<div class="bg-curve"></div>

<div class="landing" id="landingPage">
    <div class="container" style="width: 100%;">
        <div class="hero">
            <div class="hero-left">
                <h1>LORE</h1>
                <p class="tagline">Digital Archaeology — excavate the hidden story buried in your conversations.</p>
                <div class="badge-row">
                    <span class="badge">VIBE</span>
                    <span class="badge">FLOW</span>
                    <span class="badge">TIME</span>
                    <span class="badge">SLANG</span>
                </div>
                <button class="cta-btn" id="startBtn">⟳ DROP THE LORE</button>
            </div>
            <div class="hero-right">
                <div class="data-leaf"></div>
            </div>
        </div>
    </div>
</div>

<div class="dashboard" id="dashboardPage">
    <div class="container">
        <div id="statusContainer"></div>
        <div id="globalFilterContainer" style="display: none;"></div>
        <div id="dashboardContent"></div>
        <div class="footer">🔒 all insights generated locally — your data never leaves your device</div>
    </div>
</div>

<!-- Calendar Modal -->
<div class="calendar-modal" id="calendarModal">
    <div class="calendar-card">
        <div class="calendar-title">SELECT DATE RANGE</div>
        <div class="calendar-input-group">
            <label>START DATE</label>
            <input type="date" id="calendarStart">
        </div>
        <div class="calendar-input-group">
            <label>END DATE</label>
            <input type="date" id="calendarEnd">
        </div>
        <div class="calendar-error" id="calendarError">END DATE MUST BE AFTER START DATE</div>
        <div class="calendar-buttons">
            <button class="calendar-btn" id="calendarCancel">CANCEL</button>
            <button class="calendar-btn primary" id="calendarApply">APPLY</button>
        </div>
    </div>
</div>

<script>
    // ========== ENHANCED SENTIMENT & EMOTION ANALYSIS ==========
    function cleanText(t) { return t.replace(/[\u200e\u200f\u202a\u202b\u202c\u202d\u202e]/g, '').trim(); }
    
    // Emotion detection function - returns object with emotion scores
    function detectEmotions(text) {
        const emotions = {
            joy: 0,
            sadness: 0,
            excitement: 0,
            anger: 0,
            anxiety: 0,
            surprise: 0
        };
        
        const lower = text.toLowerCase();
        
        // JOY - happiness, satisfaction, contentment
        const joyWords = ['happy', 'glad', 'joy', 'delighted', 'pleased', 'wonderful', 'lovely', 'sweet', 'nice', 'good', 'great', 'awesome', 'fantastic'];
        joyWords.forEach(w => { if(lower.includes(w)) emotions.joy += 0.15; });
        if(text.includes('😊') || text.includes('😃') || text.includes('😄')) emotions.joy += 0.2;
        if(text.includes('❤️') || text.includes('💕')) emotions.joy += 0.15;
        
        // SADNESS - disappointment, loss, melancholy
        const sadnessWords = ['sad', 'sorry', 'miss', 'unfortunately', 'disappointed', 'heartbroken', 'lonely', 'tired', 'exhausted'];
        sadnessWords.forEach(w => { if(lower.includes(w)) emotions.sadness += 0.15; });
        if(text.includes('😢') || text.includes('😭') || text.includes('💔')) emotions.sadness += 0.2;
        
        // EXCITEMENT - anticipation, eagerness, high energy
        const excitementWords = ['excited', 'can\'t wait', 'hyped', 'ready', 'let\'s go', 'omg', 'wow', 'amazing', 'incredible', 'awesome'];
        excitementWords.forEach(w => { if(lower.includes(w)) emotions.excitement += 0.15; });
        const exclaimCount = (text.match(/!/g) || []).length;
        emotions.excitement += Math.min(exclaimCount * 0.08, 0.2);
        if(text.includes('🔥') || text.includes('🎉') || text.includes('🥳')) emotions.excitement += 0.15;
        if(text === text.toUpperCase() && text.length > 4) emotions.excitement += 0.15;
        
        // ANGER - frustration, irritation, hostility
        const angerWords = ['angry', 'annoying', 'frustrated', 'hate', 'stupid', 'idiot', 'shut up', 'what the', 'seriously?', 'unbelievable'];
        angerWords.forEach(w => { if(lower.includes(w)) emotions.anger += 0.2; });
        if(text.includes('😠') || text.includes('😡') || text.includes('🤬')) emotions.anger += 0.25;
        
        // ANXIETY - worry, nervousness, uncertainty
        const anxietyWords = ['worried', 'nervous', 'anxious', 'stressed', 'overwhelmed', 'what if', 'maybe', 'perhaps', 'uncertain', 'scared'];
        anxietyWords.forEach(w => { if(lower.includes(w)) emotions.anxiety += 0.15; });
        const questionCount = (text.match(/\?/g) || []).length;
        emotions.anxiety += Math.min(questionCount * 0.05, 0.15);
        
        // SURPRISE - unexpected, shocking, sudden realization
        const surpriseWords = ['what', 'wait', 'really?', 'seriously?', 'no way', 'unexpected', 'shocked', 'surprised'];
        surpriseWords.forEach(w => { if(lower.includes(w)) emotions.surprise += 0.15; });
        if(text.includes('😲') || text.includes('😱')) emotions.surprise += 0.2;
        
        // Normalize each emotion to 0-1 range
        for(let e in emotions) {
            emotions[e] = Math.min(1, emotions[e]);
        }
        
        return emotions;
    }
    
    function analyzeSentiment(text) {
        const intensePositive = ['amazing', 'incredible', 'perfect', 'love', 'beautiful', 'fantastic', 'wonderful', 'brilliant', 'obsessed', 'stunning'];
        const moderatePositive = ['good', 'great', 'nice', 'happy', 'thanks', 'awesome', 'cool', 'glad', 'enjoy', 'wow', 'yay', 'lovely', 'sweet', 'cute', 'fun'];
        const intenseNegative = ['hate', 'terrible', 'horrible', 'awful', 'disaster', 'angry', 'furious', 'worst', 'pathetic'];
        const moderateNegative = ['bad', 'sorry', 'wrong', 'issue', 'problem', 'annoying', 'frustrated', 'sad', 'upset', 'disappointed', 'tired'];
        
        let score = 0;
        const lower = text.toLowerCase();
        
        intensePositive.forEach(w => { if(lower.includes(w)) score += 0.3; });
        moderatePositive.forEach(w => { if(lower.includes(w)) score += 0.12; });
        intenseNegative.forEach(w => { if(lower.includes(w)) score -= 0.3; });
        moderateNegative.forEach(w => { if(lower.includes(w)) score -= 0.12; });
        
        const exclaimCount = (text.match(/!/g) || []).length;
        score += Math.min(exclaimCount * 0.06, 0.15);
        
        const positiveEmojis = ['😊', '😃', '😄', '🎉', '❤️', '🔥', '🥳', '😍', '👍', '✨', '💕', '😘', '🥰', '🤗'];
        const negativeEmojis = ['😠', '😡', '💔', '😢', '😭', '💀', '👎', '😤', '😞', '🙄', '😩'];
        
        positiveEmojis.forEach(e => { if(text.includes(e)) score += 0.08; });
        negativeEmojis.forEach(e => { if(text.includes(e)) score -= 0.1; });
        
        const words = text.split(/\s+/);
        const capsCount = words.filter(w => w === w.toUpperCase() && w.length > 2).length;
        score += Math.min(capsCount * 0.04, 0.12);
        
        let normalized = Math.max(-0.8, Math.min(0.8, score));
        let percentage = ((normalized + 0.8) / 1.6) * 100;
        return Math.max(0, Math.min(100, percentage));
    }
    
    function calcEnergy(text) {
        let energy = 0;
        if(text === text.toUpperCase() && text.length > 4) energy += 0.4;
        energy += Math.min((text.match(/!/g) || []).length * 0.1, 0.3);
        if(/lol|lmao|rofl|haha|hehe|lmfao/i.test(text)) energy += 0.25;
        if(/(?:^|\s)OMG|WOW|YES|YAS|LET'S GO/i.test(text)) energy += 0.2;
        return Math.min(energy, 1);
    }
    
    // Topic detection based on keywords
    function detectTopics(text) {
        const topics = {
            work: ['work', 'office', 'meeting', 'deadline', 'project', 'boss', 'colleague', 'job', 'career', 'task'],
            personal: ['family', 'friend', 'home', 'weekend', 'vacation', 'travel', 'movie', 'show', 'book', 'music'],
            humor: ['lol', 'haha', 'lmao', 'hilarious', 'funny', 'joke', 'meme', 'fun', 'laughing', 'rofl'],
            venting: ['ugh', 'annoying', 'frustrated', 'stressed', 'overwhelmed', 'tired', 'exhausted', 'hate', 'terrible'],
            planning: ['meet', 'call', 'schedule', 'plan', 'tomorrow', 'later', 'today', 'coming', 'going', 'drive'],
            support: ['thanks', 'appreciate', 'help', 'support', 'proud', 'happy for', 'congrats', 'good luck', 'hope']
        };
        
        const detected = [];
        const lower = text.toLowerCase();
        
        for(let [topic, keywords] of Object.entries(topics)) {
            for(let kw of keywords) {
                if(lower.includes(kw)) {
                    detected.push(topic);
                    break;
                }
            }
        }
        
        return detected;
    }
    
    function parseWhatsApp(text) {
        const lines = text.split(/\r?\n/);
        const messages = [];
        const pattern = /\[(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2}:\d{2})\s?([AP]M)?\]\s([^:]+):\s(.*)/i;
        let current = null;
        for(let line of lines) {
            if(!line.trim()) continue;
            if(/end-to-end encrypted|security code|deleted/i.test(line)) continue;
            const match = line.match(pattern);
            if(match) {
                if(current) messages.push(current);
                let [, dateStr, timeStr, ampm, sender, message] = match;
                sender = cleanText(sender);
                message = cleanText(message);
                let timestamp = new Date();
                try {
                    let [d,m,y] = dateStr.split('/');
                    let [h,min,sec] = timeStr.split(':');
                    let hour = parseInt(h);
                    if(ampm && ampm.toUpperCase() === 'PM' && hour < 12) hour += 12;
                    if(ampm && ampm.toUpperCase() === 'AM' && hour === 12) hour = 0;
                    timestamp = new Date(2000 + parseInt(y), parseInt(m)-1, parseInt(d), hour, parseInt(min), parseInt(sec));
                } catch(e) {}
                current = { sender, message, length: message.length, timestamp, hour: timestamp.getHours(), date: timestamp.toISOString().split('T')[0], timestampObj: timestamp, sentiment: 0, emotions: null, topics: [] };
            } else if(current) {
                current.message += ' ' + cleanText(line);
                current.length = current.message.length;
            }
        }
        if(current) messages.push(current);
        return messages;
    }
    
    let fullMessages = null;
    let allDates = [];
    let currentDateFilter = { startIdx: 0, endIdx: null };
    
    function computeStats(messages) {
        const total = messages.length;
        if(total === 0) return null;
        
        const senders = [...new Set(messages.map(m => m.sender))];
        
        for(let m of messages) {
            m.sentiment = analyzeSentiment(m.message);
            m.energy = calcEnergy(m.message);
            m.emotions = detectEmotions(m.message);
            m.topics = detectTopics(m.message);
        }
        
        const avgSentiment = messages.reduce((a,b) => a + b.sentiment, 0) / total;
        const avgEnergy = messages.reduce((a,b) => a + b.energy, 0) / total;
        const hypeScore = (avgEnergy * 100).toFixed(1);
        
        let energyLevel = "mid-energy";
        if(avgEnergy > 0.45) energyLevel = "high-energy 🔥";
        else if(avgEnergy > 0.25) energyLevel = "steady pulse";
        else energyLevel = "low-key";
        
        let vibeText = "neutral vibe";
        if(avgSentiment > 70) vibeText = "radiant ✨";
        else if(avgSentiment > 55) vibeText = "positive 🌞";
        else if(avgSentiment > 45) vibeText = "mildly positive";
        else if(avgSentiment < 30) vibeText = "heavy 🌧️";
        else if(avgSentiment < 40) vibeText = "tense";
        
        // Topic detection - most common topics overall
        const topicCounts = {};
        for(let m of messages) {
            for(let topic of m.topics) {
                topicCounts[topic] = (topicCounts[topic] || 0) + 1;
            }
        }
        const topTopics = Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
        
        // Emotion tracking - aggregate emotions
        const emotionTotals = { joy: 0, sadness: 0, excitement: 0, anger: 0, anxiety: 0, surprise: 0 };
        for(let m of messages) {
            for(let e in emotionTotals) {
                emotionTotals[e] += m.emotions[e] || 0;
            }
        }
        const dominantEmotion = Object.entries(emotionTotals).sort((a,b)=>b[1]-a[1])[0];
        
        // Conversation Balance Score (how balanced the conversation is)
        const airTimeRaw = {};
        for(let m of messages) airTimeRaw[m.sender] = (airTimeRaw[m.sender] || 0) + 1;
        const totalMsgs = messages.length;
        // Round air time percentages to whole numbers
        const airTimePct = {};
        for(let s in airTimeRaw) {
            airTimePct[s] = Math.round((airTimeRaw[s] / totalMsgs) * 100);
        }
        
        const pctValues = Object.values(airTimePct);
        const idealBalance = 100 / pctValues.length;
        let balanceScore = 100;
        for(let pct of pctValues) {
            balanceScore -= Math.abs(pct - idealBalance) * 0.8;
        }
        balanceScore = Math.max(0, Math.min(100, Math.round(balanceScore)));
        let balanceLabel = "balanced";
        if(balanceScore < 40) balanceLabel = "one-sided";
        else if(balanceScore < 70) balanceLabel = "moderately balanced";
        else balanceLabel = "well balanced";
        
        // First Response Time (TTFR) - how quickly people respond to conversation starters
        const sorted = [...messages].sort((a,b)=>a.timestamp - b.timestamp);
        const firstResponses = {};
        for(let i=1;i<sorted.length;i++) {
            if(sorted[i].sender !== sorted[i-1].sender) {
                const delta = (sorted[i].timestamp - sorted[i-1].timestamp)/60000;
                if(delta > 0 && delta < 60) {
                    if(!firstResponses[sorted[i].sender]) firstResponses[sorted[i].sender] = [];
                    firstResponses[sorted[i].sender].push(delta);
                }
            }
        }
        const avgFirstResponse = {};
        for(let s in firstResponses) {
            avgFirstResponse[s] = Math.round(firstResponses[s].reduce((a,b)=>a+b,0)/firstResponses[s].length);
        }
        const fastestFirstResponder = Object.entries(avgFirstResponse).sort((a,b)=>a[1]-b[1])[0];
        
        // Response times (existing)
        const responseTimes = [];
        for(let i=1;i<sorted.length;i++) {
            if(sorted[i].sender !== sorted[i-1].sender) {
                const delta = (sorted[i].timestamp - sorted[i-1].timestamp)/60000;
                if(delta > 0 && delta < 720) responseTimes.push(delta);
            }
        }
        const avgResponseTime = responseTimes.length > 0 ? Math.round(responseTimes.reduce((a,b)=>a+b,0)/responseTimes.length) : 0;
        
        let fastestResponder = "N/A";
        let fastestTime = Infinity;
        for(let i=1;i<sorted.length;i++) {
            if(sorted[i].sender !== sorted[i-1].sender) {
                const delta = (sorted[i].timestamp - sorted[i-1].timestamp)/60000;
                if(delta > 0 && delta < 60 && delta < fastestTime) {
                    fastestTime = delta;
                    fastestResponder = sorted[i].sender;
                }
            }
        }
        
        // Initiator
        const initiations = {};
        let lastTime = null;
        for(let m of sorted) {
            if(lastTime && (m.timestamp - lastTime) > 21600000) {
                initiations[m.sender] = (initiations[m.sender] || 0) + 1;
            }
            lastTime = m.timestamp;
        }
        let initiator = "mixed";
        let initiatorCount = 0;
        if(Object.keys(initiations).length > 0) {
            const top = Object.entries(initiations).sort((a,b)=>b[1]-a[1])[0];
            initiator = top[0];
            initiatorCount = top[1];
        }
        
        // Night Owl
        const nightOwls = {};
        for(let s of senders) {
            const nightMsgs = messages.filter(m => m.sender === s && (m.hour >= 0 && m.hour < 5)).length;
            const totalS = messages.filter(m => m.sender === s).length;
            nightOwls[s] = totalS > 0 ? ((nightMsgs/totalS)*100).toFixed(1) : 0;
        }
        const topNightOwl = Object.entries(nightOwls).sort((a,b)=>parseFloat(b[1])-parseFloat(a[1]))[0];
        
        // Double text ratio
        const doubleText = {};
        for(let i=1;i<sorted.length;i++) {
            if(sorted[i].sender === sorted[i-1].sender) {
                doubleText[sorted[i].sender] = (doubleText[sorted[i].sender] || 0) + 1;
            }
        }
        const doubleTextRatio = {};
        for(let s in doubleText) {
            const totalS = messages.filter(m => m.sender === s).length;
            doubleTextRatio[s] = totalS > 0 ? ((doubleText[s]/totalS)*100).toFixed(1) : 0;
        }
        
        // Closer award
        const days = {};
        for(let m of sorted) {
            if(!days[m.date] || m.timestamp > days[m.date].timestamp) days[m.date] = m;
        }
        const closers = {};
        for(let m of Object.values(days)) closers[m.sender] = (closers[m.sender] || 0) + 1;
        
        // Top keywords (slang) - get more for display
        const stopwords = new Set(['the','and','for','that','this','with','from','have','are','was','were','but','not','you','they','she','he','it','we','like','just','what','when','where','how','get','got','all','can','will']);
        const keywords = {};
        for(let m of messages) {
            const words = m.message.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
            for(let w of words) {
                if(!stopwords.has(w) && w.length > 2) keywords[w] = (keywords[w] || 0) + 1;
            }
        }
        const topKeywords = Object.entries(keywords).sort((a,b)=>b[1]-a[1]).slice(0,15);
        
        // Timeline
        const monthlySentiment = {};
        for(let m of messages) {
            if(!m.timestampObj) continue;
            const key = `${m.timestampObj.getFullYear()}-${String(m.timestampObj.getMonth()+1).padStart(2,'0')}`;
            monthlySentiment[key] = monthlySentiment[key] || [];
            monthlySentiment[key].push(m.sentiment);
        }
        const timelineData = Object.entries(monthlySentiment).sort().map(([k,v]) => ({ month: k, avg: v.reduce((a,b)=>a+b,0)/v.length, count: v.length }));
        
        // Trend
        const firstHalfAvg = timelineData.slice(0, Math.floor(timelineData.length/2)).reduce((a,b)=>a + b.avg, 0) / (Math.floor(timelineData.length/2) || 1);
        const secondHalfAvg = timelineData.slice(Math.floor(timelineData.length/2)).reduce((a,b)=>a + b.avg, 0) / (timelineData.length - Math.floor(timelineData.length/2) || 1);
        const trend = secondHalfAvg - firstHalfAvg;
        let trendDesc = "stable";
        if(trend > 8) trendDesc = "improving 📈";
        else if(trend < -8) trendDesc = "declining 📉";
        
        // Signature emojis with per-person counts
        const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}]/gu;
        const signatureEmojis = {};
        const perPersonEmojiCounts = {};
        for(let s of senders) {
            const emojis = messages.filter(m=>m.sender===s).flatMap(m=>m.message.match(emojiRegex)||[]);
            if(emojis.length) {
                const freq = new Map();
                emojis.forEach(e=>freq.set(e,(freq.get(e)||0)+1));
                const top = [...freq.entries()].sort((a,b)=>b[1]-a[1])[0];
                signatureEmojis[s] = top[0];
                perPersonEmojiCounts[s] = top[1];
            } else {
                signatureEmojis[s] = '—';
                perPersonEmojiCounts[s] = 0;
            }
        }
        
        // Most active hour
        const hourCounts = new Array(24).fill(0);
        for(let m of messages) hourCounts[m.hour]++;
        let mostActiveHour = 0;
        for(let h=0;h<24;h++) if(hourCounts[h] > hourCounts[mostActiveHour]) mostActiveHour = h;
        
        // Verdict
        let verdict = "";
        if(avgSentiment > 75) verdict = "This conversation radiates warmth and joy — a safe, uplifting space where people feel truly heard and valued.";
        else if(avgSentiment > 60) verdict = "Generally positive with genuine moments of connection. A healthy balance of support, laughter, and real talk.";
        else if(avgSentiment > 45) verdict = "Balanced and grounded. A mix of good days and tough conversations — feels authentically human.";
        else if(avgSentiment > 30) verdict = "There's some weight here. The conversation has its share of difficult moments, but that's part of being real with each other.";
        else verdict = "The data suggests some emotional heaviness. It might be worth checking in — sometimes the hardest conversations are the most important ones.";
        
        return {
            total, senders, avgSentiment: Math.round(avgSentiment), hypeScore, energyLevel, vibeText, trendDesc,
            avgResponseTime, fastestResponder, initiator, initiatorCount, nightOwls, topNightOwl,
            doubleTextRatio, airTimePct, closers, topKeywords, timelineData, signatureEmojis, perPersonEmojiCounts,
            mostActiveHour, verdict,
            // NEW FEATURES
            topTopics, emotionTotals, dominantEmotion, balanceScore, balanceLabel, avgFirstResponse, fastestFirstResponder
        };
    }
    
    let currentReport = null;
    let charts = {};

                    showStatus('✅ excavation complete — lore unearthed', 'success');

    function renderDashboard(r) {

        if(r.dominantEmotion) {
            const mapping = { joy: ["joy 😊", "😊"], sadness: ["sadness 😔", "😔"], excitement: ["excitement 🤩", "🤩"], anger: ["anger 😤", "😤"], anxiety: ["anxiety 😰", "😰"], surprise: ["surprise 😲", "😲"] };
            if(mapping[r.dominantEmotion[0]]) {
                dominantEmotionLabel = mapping[r.dominantEmotion[0]][0];
                dominantEmotionEmoji = mapping[r.dominantEmotion[0]][1];
            }
        }
        
        container.innerHTML = `
            <!-- PILLARS -->
            <div class="pillars-container">
                <div class="pillars-grid">
                    <div class="pillar-card">
                        <div class="pillar-icon">📈</div>
                        <div class="pillar-title">vibe <span class="info-icon">i<span class="info-tooltip">overall conversation sentiment - 0% = very heavy, 100% = radiant</span></span></div>
                        <div class="pillar-value">${r.vibeText}</div>
                        <div class="pillar-sub">${r.avgSentiment}% sentiment score</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">⚡</div>
                        <div class="pillar-title">flow <span class="info-icon">i<span class="info-tooltip">average time between messages when sender alternates - lower = faster, more engaged</span></span></div>
                        <div class="pillar-value">${r.avgResponseTime} min</div>
                        <div class="pillar-sub">avg response time</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">⏰</div>
                        <div class="pillar-title">time <span class="info-icon">i<span class="info-tooltip">energy level - all caps, exclamation marks, laughter (lol/haha), and hype words</span></span></div>
                        <div class="pillar-value">${r.hypeScore}%</div>
                        <div class="pillar-sub">${r.energyLevel}</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">💬</div>
                        <div class="pillar-title">slang <span class="info-icon">i<span class="info-tooltip">unique recurring non-dictionary words — inside jokes, catchphrases, unique expressions</span></span></div>
                        <div class="pillar-value">${r.topKeywords.length}</div>
                        <div class="pillar-sub">unique catchphrases</div>
                    </div>
                </div>
            </div>
            
            <!-- BENTO GRID (expanded to include new features) -->
            <div class="bento-grid">
                <div class="bento-card glow-bg">
                    <div class="card-header">
                        <div class="card-icon">🌡️</div>
                        <div class="card-title">mood weather <span class="info-icon">i<span class="info-tooltip">sentiment trajectory over time - shows emotional peaks and valleys</span></span></div>
                    </div>
                    <div class="card-value">${r.vibeText}</div>
                    <canvas id="timelineChart" style="height:140px"></canvas>
                    <div class="card-sub">trend: ${r.trendDesc} · ${r.timelineData.length} months of data</div>
                </div>
                
                <div class="bento-card moss">
                    <div class="card-header">
                        <div class="card-icon">⭐</div>
                        <div class="card-title">the initiator <span class="info-icon">i<span class="info-tooltip">person who most often breaks silence after 6+ hours - the conversation engine</span></span></div>
                    </div>
                    <div class="card-value">${r.initiator}</div>
                    <div class="card-sub">${r.initiatorCount} resurrections after silence</div>
                    <div class="insight-row" style="margin-top: 12px;">
                        <span class="participant-name">⚡ fastest responder</span>
                        <span class="participant-value">${r.fastestResponder}</span>
                    </div>
                    <div class="progress-bar" style="margin-top: 8px;"><div class="progress-fill" style="width: ${Object.values(r.doubleTextRatio)[0] || 0}%;"></div></div>
                    <div class="participant-item"><span class="participant-name">double-text ratio</span><span class="participant-value">${Object.values(r.doubleTextRatio)[0] || 0}%</span></div>
                </div>
                
                <div class="bento-card cocoa">
                    <div class="card-header">
                        <div class="card-icon">🌙</div>
                        <div class="card-title">night owl index <span class="info-icon">i<span class="info-tooltip">percentage of messages sent between midnight and 5 am - higher = more likely awake late</span></span></div>
                    </div>
                    <div class="card-value">${r.topNightOwl ? r.topNightOwl[0] : 'nobody'}</div>
                    <div class="card-sub">${r.topNightOwl ? r.topNightOwl[1] : 0}% of messages after midnight</div>
                    ${Object.entries(r.nightOwls).slice(0,2).map(([n,v]) => `
                        <div class="progress-bar" style="margin-top: 12px;"><div class="progress-fill" style="width: ${v}%;"></div></div>
                        <div class="participant-item"><span class="participant-name">${n}</span><span class="participant-value">${v}% night msgs</span></div>
                    `).join('')}
                </div>
                
                <div class="bento-card">
                    <div class="card-header">
                        <div class="card-icon">🎙️</div>
                        <div class="card-title">air time <span class="info-icon">i<span class="info-tooltip">percentage of total conversation volume per person - who dominates the chat</span></span></div>
                    </div>
                    ${Object.entries(r.airTimePct).map(([n,v]) => `
                        <div class="participant-item"><span class="participant-name">${n}</span><span class="participant-value">${v}%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${v}%;"></div></div>
                    `).join('')}
                </div>
                
                <div class="bento-card">
                    <div class="card-header">
                        <div class="card-icon">🏆</div>
                        <div class="card-title">closer award <span class="info-icon">i<span class="info-tooltip">who sends the last message of each day — the one who has the final word</span></span></div>
                    </div>
                    ${Object.entries(r.closers).slice(0,3).map(([n,c]) => `
                        <div class="participant-item"><span class="participant-name">${n}</span><span class="participant-value">${c} days</span></div>
                    `).join('')}
                    <div class="insight-row" style="margin-top: 8px;">
                        <span class="participant-name">⏰ most active hour</span>
                        <span class="participant-value">${r.mostActiveHour}:00</span>
                    </div>
                </div>
                
                <div class="bento-card tan">
                    <div class="card-header">
                        <div class="card-icon">📜</div>
                        <div class="card-title">the verdict <span class="info-icon">i<span class="info-tooltip">ai-generated summary of your conversation's emotional landscape</span></span></div>
                    </div>
                    <div class="verdict-text">${r.verdict}</div>
                    <div class="keyword-cloud" style="margin-top: 16px;">
                        ${r.topKeywords.slice(0,10).map(([w,c]) => `<span class="keyword">${w} (${c})</span>`).join('')}
                    </div>
                </div>
            </div>
            
            <!-- NEW FEATURES ROW -->
            <div class="pillars-container" style="margin-top: -10px;">
                <div class="pillars-grid">
                    <div class="pillar-card">
                        <div class="pillar-icon">💡</div>
                        <div class="pillar-title">top topics <span class="info-icon">i<span class="info-tooltip">most common conversation themes detected across your chat</span></span></div>
                        <div class="pillar-value">${r.topTopics.map(t => t[0].charAt(0).toUpperCase() + t[0].slice(1)).join(', ') || 'various'}</div>
                        <div class="pillar-sub">main themes</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">⚡</div>
                        <div class="pillar-title">first response <span class="info-icon">i<span class="info-tooltip">average time to reply to a new conversation starter (TTFR)</span></span></div>
                        <div class="pillar-value">${r.fastestFirstResponder ? r.fastestFirstResponder[0] : 'N/A'}</div>
                        <div class="pillar-sub">${r.fastestFirstResponder ? r.fastestFirstResponder[1] : 0} min avg</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">⚖️</div>
                        <div class="pillar-title">balance score <span class="info-icon">i<span class="info-tooltip">how equally conversation participation is distributed - higher = more balanced</span></span></div>
                        <div class="pillar-value">${r.balanceScore}%</div>
                        <div class="pillar-sub">${r.balanceLabel}</div>
                    </div>
                    <div class="pillar-card">
                        <div class="pillar-icon">🎭</div>
                        <div class="pillar-title">dominant emotion <span class="info-icon">i<span class="info-tooltip">most frequently detected emotion across all messages</span></span></div>
                        <div class="pillar-value">${dominantEmotionLabel}</div>
                        <div class="pillar-sub">${dominantEmotionEmoji} overall mood</div>
                    </div>
                </div>
            </div>
            
            <!-- SIGNATURE EMOJIS + STATS -->
            <div class="pillars-container" style="margin-top: -10px;">
                <div class="emoji-grid">
                    ${Object.entries(r.signatureEmojis).map(([name, emoji]) => `
                        <div class="emoji-item">
                            <div class="emoji-char">${emoji}</div>
                            <div class="emoji-name">${name}</div>
                            <div class="emoji-count">${r.perPersonEmojiCounts[name] || 0} uses</div>
                        </div>
                    `).join('')}
                </div>
                <div class="stats-footer">
                    <div class="stat-footer-item">
                        <div class="stat-footer-label">📬 total messages</div>
                        <div class="stat-footer-value">${r.total.toLocaleString()}</div>
                    </div>
                    <div class="stat-footer-item">
                        <div class="stat-footer-label">👥 participants</div>
                        <div class="stat-footer-value">${r.senders.length}</div>
                    </div>
                    <div class="stat-footer-item">
                        <div class="stat-footer-label">🏷️ top slang</div>
                        <div class="stat-footer-value">"${r.topKeywords[0]?.[0] || '—'}"</div>
                    </div>
                </div>
            </div>
        `;
        
        // Timeline Chart
        if(charts.timeline) charts.timeline.destroy();
        const ctx = document.getElementById('timelineChart').getContext('2d');
        charts.timeline = new Chart(ctx, {
            type: 'line',
            data: {
                labels: r.timelineData.map(d => formatMonthLabel(d.month)),
                datasets: [{
                    label: 'sentiment %',
                    data: r.timelineData.map(d => d.avg),
                    borderColor: '#bcfe2f',
                    backgroundColor: 'rgba(188, 254, 47, 0.05)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointBackgroundColor: '#bcfe2f',
                    pointBorderColor: '#050505',
                    pointBorderWidth: 1.5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `sentiment: ${Math.round(ctx.raw)}%` } }
                },
                scales: {
                    y: { min: 0, max: 100, grid: { color: '#2a2a2a' }, ticks: { color: '#8a8a8a', callback: (val) => `${val}%` } },
                    x: { ticks: { color: '#8a8a8a', font: { size: 9, weight: '500' } } }
                }
            }
        });
    }
</script>
</body>
</html>
