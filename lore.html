<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LORE — Digital Archaeology</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --taupe: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', -apple-system, sans-serif; background: #050505; color: #e8e8e8; overflow-x: hidden; }
        .bg-curve { position: fixed; top: 0; right: 0; width: 60%; height: 80vh; background: radial-gradient(ellipse at 70% 30%, rgba(188, 254, 47, 0.08), transparent 60%); z-index: 0; pointer-events: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 48px; position: relative; z-index: 2; }
        @media (max-width: 768px) { .container { padding: 24px 20px; } }
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-bottom: 60px; align-items: center; }
        @media (max-width: 768px) { .hero { grid-template-columns: 1fr; gap: 32px; text-align: center; margin-bottom: 40px; } .hero-right { order: -1; } }
        .hero-left h1 { font-size: 5rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg, #ffffff 0%, #bcfe2f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 20px; }
        @media (max-width: 768px) { .hero-left h1 { font-size: 3.2rem; } }
        .hero-left .tagline { font-size: 1rem; color: #8a8a8a; margin-bottom: 32px; line-height: 1.5; }
        .badge-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
        @media (max-width: 768px) { .badge-row { justify-content: center; } }
        .badge { background: rgba(188, 254, 47, 0.08); border: 1px solid rgba(188, 254, 47, 0.2); padding: 6px 16px; border-radius: 40px; font-size: 0.7rem; font-weight: 500; color: #bcfe2f; }
        .cta-btn { background: linear-gradient(135deg, #f5a623, #e8951a); color: #050505; border: none; padding: 16px 40px; font-size: 1rem; font-weight: 700; border-radius: 60px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(245, 166, 35, 0.3); animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(245, 166, 35, 0.3); } 50% { box-shadow: 0 0 40px rgba(245, 166, 35, 0.6); } }
        .cta-btn:hover { transform: translateY(-2px); }
        .data-leaf { position: relative; width: 280px; height: 280px; background: linear-gradient(135deg, rgba(188, 254, 47, 0.1), rgba(188, 254, 47, 0.02)); border-radius: 60% 40% 50% 50% / 40% 50% 50% 60%; animation: float-leaf 6s ease-in-out infinite; margin: 0 auto; }
        @media (max-width: 768px) { .data-leaf { width: 160px; height: 160px; } .data-leaf::before { font-size: 2.5rem; } }
        @keyframes float-leaf { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
        .data-leaf::before { content: '📜'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; opacity: 0.8; }
        .global-filter { background: rgba(42, 42, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(188, 254, 47, 0.15); border-radius: 60px; padding: 12px 24px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
        .filter-label { font-size: 0.75rem; font-weight: 500; color: #bcfe2f; display: flex; align-items: center; gap: 8px; }
        .slider-wrapper { flex: 1; min-width: 300px; position: relative; padding: 0 10px; }
        .double-slider { position: relative; height: 4px; background: #2a2a2a; border-radius: 2px; margin: 20px 0; }
        .slider-track-fill { position: absolute; height: 4px; background: #bcfe2f; border-radius: 2px; pointer-events: none; }
        input[type="range"] { position: absolute; width: 100%; height: 4px; -webkit-appearance: none; background: transparent; pointer-events: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #bcfe2f; border-radius: 50%; cursor: pointer; border: 2px solid #050505; pointer-events: auto; }
        .date-controls { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 40px; }
        .date-picker-btn { background: transparent; border: 1px solid rgba(188, 254, 47, 0.3); color: #bcfe2f; padding: 6px 14px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; }
        .calendar-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .calendar-modal.show { display: flex; }
        .calendar-card { background: #1a1a1a; border: 1px solid #bcfe2f; border-radius: 24px; padding: 28px; width: 360px; }
        .pillars-container { background: rgba(42, 42, 42, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(188, 254, 47, 0.15); border-radius: 28px; padding: 32px 40px; margin-bottom: 24px; }
        .pillars-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
        @media (max-width: 768px) { .pillars-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
        .pillar-card { text-align: center; transition: transform 0.3s ease; animation: fade-up 0.5s ease forwards; opacity: 0; position: relative; }
        @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .pillar-icon { font-size: 2.5rem; margin-bottom: 12px; filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.3)); }
        .pillar-title { font-size: 0.85rem; font-weight: 600; color: #bcfe2f; letter-spacing: 1px; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px; }
        .pillar-value { font-size: 1.6rem; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
        .pillar-sub { font-size: 0.7rem; color: #8a8a8a; }
        .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        @media (max-width: 768px) { .bento-grid { grid-template-columns: 1fr; } }
        .bento-card { background: var(--taupe); border-radius: 20px; padding: 24px; transition: all 0.3s ease; border: 1px solid #3a3a3a; animation: fade-up 0.6s ease forwards; opacity: 0; position: relative; overflow: visible; }
        .bento-card:hover { transform: translateY(-4px); border-color: #bcfe2f; }
        .bento-card.glow-bg { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); }
        .bento-card.moss { background: #1a2e0a; border-color: rgba(188, 254, 47, 0.3); }
        .bento-card.cocoa { background: #2a1f1a; border-color: rgba(245, 166, 35, 0.2); }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .card-icon { font-size: 1.8rem; }
        .card-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #bcfe2f; display: inline-flex; align-items: center; gap: 6px; }
        .verdict-text { font-size: 0.9rem; line-height: 1.5; color: #e8e8e8; margin-top: 12px; }
        canvas { max-height: 160px; width: 100% !important; }
        
        /* Fixed tooltip system - positioned relative to cursor */
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: #2a2a2a;
            color: #bcfe2f;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-left: 5px;
            flex-shrink: 0;
            position: relative;
        }
        
        .info-icon:hover {
            background: #bcfe2f;
            color: #050505;
        }
        
        /* Tooltip that follows mouse position */
        .info-tooltip {
            position: fixed;
            background: #1a1a1a;
            color: #bcfe2f;
            font-size: 0.7rem;
            padding: 10px 14px;
            border-radius: 12px;
            font-family: 'Outfit', monospace;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0.2px;
            border: 1px solid #bcfe2f;
            white-space: normal;
            word-wrap: break-word;
            max-width: 280px;
            min-width: 160px;
            text-align: left;
            line-height: 1.4;
            pointer-events: none;
            z-index: 10000;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: opacity 0.15s ease;
        }
        
        .progress-bar { width: 100%; height: 4px; background: #2a2a2a; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #bcfe2f; border-radius: 2px; }
        .participant-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.8rem; }
        .keyword-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .keyword { background: #1a1a1a; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; border: 1px solid #2a2a2a; transition: all 0.2s; }
        .keyword:hover { background: #bcfe2f; color: #050505; }
        .status { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 16px; margin-bottom: 24px; text-align: center; }
        .spinner { width: 20px; height: 20px; border: 2px solid #2a2a2a; border-top-color: #bcfe2f; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050505; }
        .landing.hide { display: none; }
        .dashboard { display: none; }
        .dashboard.show { display: block; }
        .footer { text-align: center; padding: 40px 0 20px; font-size: 0.65rem; color: #4a4a4a; border-top: 1px solid #1a1a1a; margin-top: 40px; }
        .players-scroll { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; max-height: 420px; overflow-y: auto; padding: 4px; justify-content: flex-start; }
        .player-card-small { background: #111318; border-radius: 20px; padding: 16px; flex: 1 1 220px; border: 1px solid #2a2d36; min-width: 200px; }
        .player-name-dark { font-size: 1rem; font-weight: 700; color: #bcfe2f; margin-bottom: 12px; border-left: 3px solid #bcfe2f; padding-left: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .player-stats-grid-dark { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.7rem; }
        .player-stats-grid-dark div { display: flex; align-items: center; gap: 4px; }
        .stats-footer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(188, 254, 47, 0.1); text-align: center; }
        .insight-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.75rem; }
        .extra-metrics { background: rgba(42,42,42,0.3); border-radius: 16px; padding: 12px 16px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
        .extra-metric { text-align: center; flex: 1; min-width: 100px; }
        .extra-metric-label { font-size: 0.6rem; color: #8a8a8a; text-transform: uppercase; letter-spacing: 0.5px; }
        .extra-metric-value { font-size: 1rem; font-weight: 700; color: #bcfe2f; margin-top: 4px; }
        .fav-emoji-badge { background: rgba(188,254,47,0.15); border-radius: 20px; padding: 4px 10px; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="bg-curve"></div>
<div class="landing" id="landingPage">
    <div class="container">
        <div class="hero">
            <div class="hero-left">
                <h1>LORE</h1>
                <p class="tagline">Digital Archaeology — excavate the hidden story buried in your conversations. Works with any WhatsApp chat export.</p>
                <div class="badge-row">
                    <span class="badge">VIBE</span>
                    <span class="badge">FLOW</span>
                    <span class="badge">HYPE</span>
                    <span class="badge">SLANG</span>
                </div>
                <button class="cta-btn" id="startBtn">⟳ DROP THE LORE</button>
            </div>
            <div class="hero-right">
                <div class="data-leaf"></div>
            </div>
        </div>
    </div>
</div>
<div class="dashboard" id="dashboardPage">
    <div class="container">
        <div id="statusContainer"></div>
        <div id="globalFilterContainer" style="display: none;"></div>
        <div id="dashboardContent"></div>
        <div class="footer">🔒 all insights generated locally — your data never leaves your device</div>
    </div>
</div>
<div class="calendar-modal" id="calendarModal">
    <div class="calendar-card">
        <div class="calendar-title">SELECT DATE RANGE</div>
        <div class="calendar-input-group"><label>START DATE</label><input type="date" id="calendarStart"></div>
        <div class="calendar-input-group"><label>END DATE</label><input type="date" id="calendarEnd"></div>
        <div class="calendar-error" id="calendarError" style="color:#f5a623; font-size:0.7rem; display:none;"></div>
        <div class="calendar-buttons"><button class="calendar-btn" id="calendarCancel">CANCEL</button><button class="calendar-btn primary" id="calendarApply">APPLY</button></div>
    </div>
</div>

<script>
    // ========== GLOBAL TOOLTIP HANDLER ==========
    let activeTooltip = null;
    
    function showTooltip(element, text, event) {
        if (activeTooltip) activeTooltip.remove();
        const tooltip = document.createElement('div');
        tooltip.className = 'info-tooltip';
        tooltip.textContent = text;
        document.body.appendChild(tooltip);
        
        let x = event.clientX + 15;
        let y = event.clientY + 15;
        
        const rect = tooltip.getBoundingClientRect();
        if (x + rect.width > window.innerWidth - 10) {
            x = event.clientX - rect.width - 10;
        }
        if (y + rect.height > window.innerHeight - 10) {
            y = event.clientY - rect.height - 10;
        }
        if (x < 10) x = 10;
        if (y < 10) y = 10;
        
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
        activeTooltip = tooltip;
    }
    
    function hideTooltip() {
        if (activeTooltip) {
            activeTooltip.remove();
            activeTooltip = null;
        }
    }
    
    document.addEventListener('mouseover', function(e) {
        const icon = e.target.closest('.info-icon');
        if (icon && icon.dataset.tooltip) {
            showTooltip(icon, icon.dataset.tooltip, e);
        }
    });
    document.addEventListener('mouseout', function(e) {
        const icon = e.target.closest('.info-icon');
        if (icon) {
            hideTooltip();
        }
    });
    document.addEventListener('mousemove', function(e) {
        if (activeTooltip && e.target.closest('.info-icon')) {
            let x = e.clientX + 15;
            let y = e.clientY + 15;
            const rect = activeTooltip.getBoundingClientRect();
            if (x + rect.width > window.innerWidth - 10) {
                x = e.clientX - rect.width - 10;
            }
            if (y + rect.height > window.innerHeight - 10) {
                y = e.clientY - rect.height - 10;
            }
            if (x < 10) x = 10;
            if (y < 10) y = 10;
            activeTooltip.style.left = x + 'px';
            activeTooltip.style.top = y + 'px';
        }
    });
    
    // ========== ULTRA-FAST PARSER ==========
    function cleanText(t) { return t.replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim(); }
    
    function parseWhatsAppSuperFast(text) {
        const lines = text.split(/\r?\n/);
        const messages = [];
        const bracketPattern = /\[(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2}:\d{2})\s?([AP]M)?\]\s([^:]+):\s(.*)/i;
        const dashPattern = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s(\d{1,2}:\d{2})(?::\d{2})?\s?([AP]M)?\s[-–]\s([^:]+):\s(.*)/i;
        let current = null;
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!line.trim()) continue;
            if (line.includes("end-to-end encrypted") || line.includes("Messages and calls") || line.includes("deleted this message")) continue;
            
            let match = bracketPattern.exec(line) || dashPattern.exec(line);
            if (match) {
                if (current) messages.push(current);
                let [, dateStr, timeStr, ampm, sender, message] = match;
                sender = cleanText(sender);
                message = cleanText(message);
                let timestamp = new Date();
                try {
                    let [d, m, y] = dateStr.split('/');
                    let [h, min, sec] = timeStr.split(':');
                    let hour = parseInt(h, 10);
                    if (ampm && ampm.toUpperCase() === 'PM' && hour < 12) hour += 12;
                    if (ampm && ampm.toUpperCase() === 'AM' && hour === 12) hour = 0;
                    timestamp = new Date(Date.UTC(2000 + parseInt(y,10), parseInt(m,10)-1, parseInt(d,10), hour, parseInt(min,10), sec ? parseInt(sec,10) : 0));
                } catch(e) { }
                current = { 
                    sender, 
                    message: message.substring(0, 500),
                    timestamp, 
                    date: timestamp.toISOString().split('T')[0],
                    hour: timestamp.getUTCHours()
                };
            } else if (current) {
                if (current.message.length < 800) current.message += ' ' + cleanText(line);
            }
        }
        if (current) messages.push(current);
        return messages;
    }
    
    // ========== UTILITY: FILTER URLS AND PROTOCOLS FROM WORDS ==========
    function isValidWord(word) {
        if (!word || word.length < 3) return false;
        // Exclude URLs, protocols, domains
        if (word.startsWith('http') || word.startsWith('www') || word.includes('.com') || word.includes('.org') || word.includes('.net')) return false;
        if (word.includes('://') || word.includes('https') || word.includes('http')) return false;
        // Exclude common media references
        if (word === 'image' || word === 'video' || word === 'gif' || word === 'sticker' || word === 'media' || word === 'omitted') return false;
        // Exclude if it looks like a file path or has too many slashes
        if (word.includes('/') && word.length > 20) return false;
        return true;
    }
    
    // ========== OPTIMIZED ANALYZER ==========
    const posWords = /(good|great|awesome|amazing|fantastic|wonderful|perfect|beautiful|love|thanks|happy|glad|joy|proud|congrats|fun|cool|yes|vibes|epic|legendary)/i;
    const negWords = /(bad|terrible|horrible|awful|hate|angry|annoying|frustrated|sad|disappointed|stressed|cringe|trash|ugh)/i;
    const energyWords = /(lol|lmao|haha|omg|wow|lets go)/i;
    
    function fastSentiment(text) {
        let score = 58;
        const lower = text.toLowerCase();
        if (posWords.test(lower)) score += 20;
        if (negWords.test(lower)) score -= 8;
        if (lower.includes('love you')) score += 18;
        const exc = (text.match(/!/g) || []).length;
        score += Math.min(exc * 3, 10);
        if (/[😊😍🔥👍🥳❤️✨]/.test(text)) score += 12;
        return Math.min(98, Math.max(20, score));
    }
    
    function fastEnergy(text) {
        let e = 50;
        if (text === text.toUpperCase() && text.length > 4) e += 18;
        e += Math.min((text.match(/!/g) || []).length * 6, 20);
        if (energyWords.test(text.toLowerCase())) e += 12;
        return Math.min(98, Math.max(32, e));
    }
    
    function computeGroupStatsOptimized(messages) {
        if (!messages.length) return null;
        const total = messages.length;
        const senderMap = new Map();
        const hourCounts = new Array(24).fill(0);
        const keywords = new Map();
        const timelineMap = new Map();
        const dailyCloser = new Map();
        const topicCounts = new Map();
        const stopSet = new Set(['the','and','for','that','this','with','from','have','are','was','were','but','not','you','like','just','what','when','where','get','can','will']);
        
        let prevSender = null;
        let totalSentiment = 0, totalEnergy = 0;
        
        for (let i = 0; i < messages.length; i++) {
            const m = messages[i];
            const sentiment = fastSentiment(m.message);
            const energy = fastEnergy(m.message);
            totalSentiment += sentiment;
            totalEnergy += energy;
            m.sentiment = sentiment;
            
            hourCounts[m.hour]++;
            
            const monthKey = `${m.timestamp.getUTCFullYear()}-${String(m.timestamp.getUTCMonth()+1).padStart(2,'0')}`;
            let tl = timelineMap.get(monthKey);
            if (!tl) timelineMap.set(monthKey, { sum: 0, count: 0 });
            tl = timelineMap.get(monthKey);
            tl.sum += sentiment;
            tl.count++;
            
            const lowerMsg = m.message.toLowerCase();
            if (/(work|office|meeting|deadline|project|job)/i.test(lowerMsg)) topicCounts.set('work', (topicCounts.get('work')||0)+1);
            else if (/(family|friend|home|weekend|vacation|travel|movie|music)/i.test(lowerMsg)) topicCounts.set('personal', (topicCounts.get('personal')||0)+1);
            else if (/(lol|haha|lmao|funny|meme|hilarious)/i.test(lowerMsg)) topicCounts.set('humor', (topicCounts.get('humor')||0)+1);
            else if (/(ugh|annoying|stressed|tired|hate|frustrated)/i.test(lowerMsg)) topicCounts.set('venting', (topicCounts.get('venting')||0)+1);
            else if (/(meet|schedule|plan|tomorrow|later|today)/i.test(lowerMsg)) topicCounts.set('planning', (topicCounts.get('planning')||0)+1);
            
            // Extract words - filter out URLs and invalid words
            const words = m.message.toLowerCase().match(/\b[a-z]{3,}\b/g);
            if (words) {
                for (let w of words) {
                    if (!stopSet.has(w) && w.length > 3 && isValidWord(w)) {
                        keywords.set(w, (keywords.get(w) || 0) + 1);
                    }
                }
            }
            
            let sd = senderMap.get(m.sender);
            if (!sd) {
                sd = { count: 0, sentimentSum: 0, energySum: 0, nightMsgs: 0, doubleTexts: 0, vocab: new Set(), emojiFreq: new Map() };
                senderMap.set(m.sender, sd);
            }
            sd.count++;
            sd.sentimentSum += sentiment;
            sd.energySum += energy;
            if (m.hour >= 0 && m.hour < 5) sd.nightMsgs++;
            if (prevSender === m.sender) sd.doubleTexts++;
            if (words) {
                for (let w of words) {
                    if (!stopSet.has(w) && w.length > 3 && isValidWord(w)) sd.vocab.add(w);
                }
            }
            
            const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F900}-\u{1F9FF}]/gu;
            const emojis = m.message.match(emojiRegex);
            if (emojis) {
                for (let em of emojis) {
                    sd.emojiFreq.set(em, (sd.emojiFreq.get(em) || 0) + 1);
                }
            }
            
            const existing = dailyCloser.get(m.date);
            if (!existing || m.timestamp > existing.timestamp) {
                dailyCloser.set(m.date, { sender: m.sender, timestamp: m.timestamp });
            }
            
            prevSender = m.sender;
        }
        
        let responseSum = 0, responseCount = 0;
        let limit = Math.min(messages.length, 3000);
        for (let i = 1; i < limit; i++) {
            if (messages[i].sender !== messages[i-1].sender) {
                const delta = (messages[i].timestamp - messages[i-1].timestamp) / 60000;
                if (delta > 0 && delta < 720) {
                    responseSum += delta;
                    responseCount++;
                }
            }
        }
        const avgResponseTime = responseCount > 0 ? Math.round(responseSum / responseCount) : 0;
        
        let initMap = new Map();
        let lastTime = null;
        for (let i = 0; i < messages.length; i++) {
            if (lastTime && (messages[i].timestamp - lastTime) > 21600000) {
                initMap.set(messages[i].sender, (initMap.get(messages[i].sender) || 0) + 1);
            }
            lastTime = messages[i].timestamp;
        }
        let topInitiator = "mixed";
        let initCount = 0;
        if (initMap.size) {
            const sorted = Array.from(initMap.entries()).sort((a,b) => b[1] - a[1]);
            topInitiator = sorted[0][0];
            initCount = sorted[0][1];
        }
        
        const participants = Array.from(senderMap.keys());
        const senderStats = {};
        const favoriteEmojis = {};
        
        for (let [name, data] of senderMap.entries()) {
            senderStats[name] = {
                count: data.count,
                pct: Math.round((data.count/total)*100),
                sentiment: Math.round(data.sentimentSum/data.count),
                energy: Math.round(data.energySum/data.count),
                vocab: data.vocab.size,
                nightPct: (data.nightMsgs/data.count) * 100,
                doublePct: (data.doubleTexts/data.count) * 100
            };
            if (data.emojiFreq.size > 0) {
                const sortedEmojis = Array.from(data.emojiFreq.entries()).sort((a,b) => b[1] - a[1]);
                favoriteEmojis[name] = { emoji: sortedEmojis[0][0], count: sortedEmojis[0][1] };
            } else {
                favoriteEmojis[name] = { emoji: '💬', count: 0 };
            }
        }
        
        const nightRank = participants.map(p => ({ name: p, pct: senderStats[p].nightPct })).sort((a,b) => b.pct - a.pct).slice(0,5);
        const closerCounts = new Map();
        for (let closer of dailyCloser.values()) closerCounts.set(closer.sender, (closerCounts.get(closer.sender)||0)+1);
        const topClosers = Array.from(closerCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,5);
        
        const topKeywords = Array.from(keywords.entries()).sort((a,b)=>b[1]-a[1]).slice(0,12);
        
        const timelineData = Array.from(timelineMap.entries()).sort().map(([k, v]) => ({ month: k, avg: v.sum / v.count }));
        const half = Math.floor(timelineData.length/2);
        const firstHalf = timelineData.slice(0,half).reduce((a,b)=>a+b.avg,0)/(half||1);
        const secondHalf = timelineData.slice(half).reduce((a,b)=>a+b.avg,0)/(timelineData.length-half||1);
        const trend = secondHalf - firstHalf;
        const trendDesc = trend > 6 ? "improving 📈" : (trend < -6 ? "declining 📉" : "stable");
        
        const avgSentiment = totalSentiment/total;
        const avgEnergyTotal = totalEnergy/total;
        let vibeText = avgSentiment>72 ? "radiant ✨" : (avgSentiment>62 ? "positive 🌞" : (avgSentiment>54 ? "mildly positive" : (avgSentiment<40 ? "heavy 🌧️" : "neutral")));
        
        let mostActiveHour = 0;
        for (let h=1;h<24;h++) if(hourCounts[h] > hourCounts[mostActiveHour]) mostActiveHour = h;
        
        let verdict = avgSentiment>75 ? "This space radiates warmth — members feel genuinely seen and valued. Rare emotional chemistry." :
                     (avgSentiment>62 ? "Positive, supportive atmosphere with real connection. Keep nurturing it." :
                     (avgSentiment>50 ? "Authentic mix of ups and downs — real relationships have texture." :
                     "Some emotional weight, but small gestures of care can shift the weather."));
        
        return {
            total, avgSentiment: Math.round(avgSentiment), hypeScore: avgEnergyTotal.toFixed(1), vibeText, trendDesc,
            avgResponseTime, topInitiator, initCount, nightRank, topClosers, topKeywords, timelineData,
            participants: participants.slice(0, 25), senderStats, mostActiveHour, favoriteEmojis,
            verdict, topTopics: Array.from(topicCounts.entries()).sort((a,b)=>b[1]-a[1]).slice(0,3),
            totalMessages: total
        };
    }
    
    // ========== APP STATE ==========
    let fullMessages = null, allDates = [], currentFilter = { startIdx: 0, endIdx: null }, currentReport = null;
    const landingPage = document.getElementById('landingPage');
    const dashboardPage = document.getElementById('dashboardPage');
    const startBtn = document.getElementById('startBtn');
    
    startBtn.onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.txt';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            landingPage.classList.add('hide');
            dashboardPage.classList.add('show');
            document.getElementById('statusContainer').innerHTML = `<div class="status"><span class="spinner"></span> excavating artifacts...</div>`;
            setTimeout(async () => {
                const text = await file.text();
                setTimeout(() => {
                    fullMessages = parseWhatsAppSuperFast(text);
                    if (!fullMessages.length) {
                        document.getElementById('statusContainer').innerHTML = `<div class="status" style="border-color:#f5a623;">❌ Could not parse messages. Check WhatsApp export format.</div>`;
                        return;
                    }
                    allDates = [...new Set(fullMessages.map(m => m.date))].sort();
                    currentFilter = { startIdx: 0, endIdx: allDates.length-1 };
                    currentReport = computeGroupStatsOptimized(fullMessages);
                    renderDashboardOptimized(currentReport);
                    renderGlobalFilterGroup();
                    document.getElementById('statusContainer').innerHTML = `<div class="status" style="border-color:#bcfe2f;">✅ ${fullMessages.length} messages — ${currentReport.participants.length} participants</div>`;
                    setTimeout(() => { document.getElementById('statusContainer').innerHTML = ''; }, 2500);
                }, 10);
            }, 10);
        };
        input.click();
    };
    
    function renderGlobalFilterGroup() {
        const container = document.getElementById('globalFilterContainer');
        if (!allDates.length) return;
        const fmt = (d) => { let [y,m,day]=d.split('-'); return `${parseInt(m)}/${parseInt(day)}/${y}`; };
        const startDate = allDates[currentFilter.startIdx], endDate = allDates[currentFilter.endIdx];
        container.style.display = 'block';
        container.innerHTML = `<div class="global-filter"><div class="filter-label"><span class="info-icon" data-tooltip="Filter insights by date range. Sliders adjust excavation depth.">i</span> Excavation Depth</div>
            <div class="slider-wrapper"><div class="double-slider"><div class="slider-track-fill" id="sliderFill"></div><input type="range" id="startSlider" min="0" max="${allDates.length-1}" value="0" step="1"><input type="range" id="endSlider" min="0" max="${allDates.length-1}" value="${allDates.length-1}" step="1"></div></div>
            <div class="date-controls"><div class="date-range-display" id="globalDateRange">${fmt(startDate)} → ${fmt(endDate)}</div><button class="date-picker-btn" id="calendarBtn">📅 select</button></div></div>`;
        const startS = document.getElementById('startSlider'), endS = document.getElementById('endSlider'), fill = document.getElementById('sliderFill');
        const update = () => {
            let s = parseInt(startS.value), e = parseInt(endS.value);
            if (s > e) { s = e; startS.value = s; }
            if (e < s) { e = s; endS.value = e; }
            currentFilter.startIdx = s; currentFilter.endIdx = e;
            const filteredMsgs = fullMessages.filter(m => m.date >= allDates[s] && m.date <= allDates[e]);
            currentReport = computeGroupStatsOptimized(filteredMsgs);
            renderDashboardOptimized(currentReport);
            document.getElementById('globalDateRange').innerText = `${fmt(allDates[s])} → ${fmt(allDates[e])}`;
            const left = (s/(allDates.length-1))*100, right = ((allDates.length-1-e)/(allDates.length-1))*100;
            if (fill) { fill.style.left = `${left}%`; fill.style.right = `${right}%`; }
        };
        startS.oninput = update; endS.oninput = update; update();
        document.getElementById('calendarBtn').onclick = () => document.getElementById('calendarModal').classList.add('show');
    }
    
    function renderDashboardOptimized(r) {
        if (!r) return;
        const container = document.getElementById('dashboardContent');
        const topAir = r.participants.map(p => ({ name: p, pct: r.senderStats[p].pct })).sort((a,b)=>b.pct-a.pct).slice(0,6);
        const nightTop = r.nightRank.slice(0,4).map(n => ({ ...n, pct: n.pct.toFixed(1) }));
        const closerTop = r.topClosers.slice(0,4);
        
        container.innerHTML = `
            <div class="pillars-container"><div class="pillars-grid">
                <div class="pillar-card"><div class="pillar-icon">🌡️</div><div class="pillar-title">vibe <span class="info-icon" data-tooltip="Overall sentiment based on positive/negative words, exclamations, and emojis. 0-100 scale.">i</span></div><div class="pillar-value">${r.vibeText}</div><div class="pillar-sub">${r.avgSentiment}%</div></div>
                <div class="pillar-card"><div class="pillar-icon">⚡</div><div class="pillar-title">flow <span class="info-icon" data-tooltip="Average time between messages from different senders (minutes). Lower = faster paced.">i</span></div><div class="pillar-value">${r.avgResponseTime} min</div><div class="pillar-sub">avg response</div></div>
                <div class="pillar-card"><div class="pillar-icon">🔥</div><div class="pillar-title">hype <span class="info-icon" data-tooltip="Energy based on ALL CAPS, exclamation marks, laughter (lol/haha), excited emojis.">i</span></div><div class="pillar-value">${r.hypeScore}%</div><div class="pillar-sub">energy</div></div>
                <div class="pillar-card"><div class="pillar-icon">👥</div><div class="pillar-title">members <span class="info-icon" data-tooltip="Unique participants who sent at least one message.">i</span></div><div class="pillar-value">${r.participants.length}</div><div class="pillar-sub">active</div></div>
            </div></div>
            
            <div class="players-scroll">${r.participants.slice(0,12).map(p => {
                const fav = r.favoriteEmojis[p] || { emoji: '💬', count: 0 };
                return `<div class="player-card-small"><div class="player-name-dark">${escapeHtml(p)} <span class="fav-emoji-badge">${fav.emoji} ${fav.count}</span></div>
                <div class="player-stats-grid-dark">
                    <div><span class="info-icon" data-tooltip="Total messages sent">i</span> 📨 ${r.senderStats[p].count}</div>
                    <div><span class="info-icon" data-tooltip="Share of total conversation">i</span> 📊 ${r.senderStats[p].pct}%</div>
                    <div><span class="info-icon" data-tooltip="Average sentiment (0-100)">i</span> ❤️ ${r.senderStats[p].sentiment}%</div>
                    <div><span class="info-icon" data-tooltip="Average energy level">i</span> ⚡ ${r.senderStats[p].energy}%</div>
                    <div><span class="info-icon" data-tooltip="Messages sent after midnight (0-5am)">i</span> 🌙 ${r.senderStats[p].nightPct.toFixed(1)}%</div>
                    <div><span class="info-icon" data-tooltip="Two+ messages in a row (double-texting)">i</span> 🔁 ${r.senderStats[p].doublePct.toFixed(1)}%</div>
                </div></div>`;
            }).join('')}</div>
            
            <div class="bento-grid">
                <div class="bento-card glow-bg"><div class="card-header"><div class="card-icon">📈</div><div class="card-title">mood weather <span class="info-icon" data-tooltip="Sentiment trend over months. Each point shows average monthly sentiment (0-100).">i</span></div></div><canvas id="timelineChart" style="height:160px"></canvas><div class="card-sub">trend: ${r.trendDesc}</div></div>
                
                <div class="bento-card moss"><div class="card-header"><div class="card-icon">👑</div><div class="card-title">initiator <span class="info-icon" data-tooltip="Person who most often restarts conversation after 6+ hours of silence.">i</span></div></div><div class="card-value">${escapeHtml(r.topInitiator)}</div><div class="card-sub">${r.initCount} resurrections</div>
                <div class="extra-metrics"><div class="extra-metric"><div class="extra-metric-label">🚀 avg response</div><div class="extra-metric-value">${r.avgResponseTime} min</div></div><div class="extra-metric"><div class="extra-metric-label">📬 total messages</div><div class="extra-metric-value">${r.totalMessages.toLocaleString()}</div></div></div></div>
                
                <div class="bento-card cocoa"><div class="card-header"><div class="card-icon">🌙</div><div class="card-title">night owls <span class="info-icon" data-tooltip="Percentage of messages sent after midnight. Higher = more nocturnal.">i</span></div></div>${nightTop.map(n=>`<div class="participant-item"><span>${escapeHtml(n.name)}</span><span>${n.pct}% 🌙</span></div><div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, parseFloat(n.pct))}%;"></div></div>`).join('')}</div>
                
                <div class="bento-card"><div class="card-header"><div class="card-icon">🎙️</div><div class="card-title">air time <span class="info-icon" data-tooltip="Percentage of total messages sent by each person.">i</span></div></div>${topAir.map(a=>`<div class="progress-bar"><div class="progress-fill" style="width:${a.pct}%"></div></div><div class="participant-item"><span>${escapeHtml(a.name)}</span><span>${a.pct}%</span></div>`).join('')}</div>
                
                <div class="bento-card"><div class="card-header"><div class="card-icon">🏆</div><div class="card-title">closers <span class="info-icon" data-tooltip="Person who sends the last message of each day (most frequent closer).">i</span></div></div>${closerTop.map(c=>`<div class="participant-item"><span>${escapeHtml(c[0])}</span><span>${c[1]} days</span></div>`).join('')}<div class="insight-row"><span>⏰ peak hour <span class="info-icon" data-tooltip="Hour with most messages sent (24h format).">i</span></span><span>${r.mostActiveHour}:00</span></div></div>
                
                <div class="bento-card tan"><div class="card-header"><div class="card-icon">📜</div><div class="card-title">verdict <span class="info-icon" data-tooltip="AI-style emotional summary based on sentiment analysis.">i</span></div></div><div class="verdict-text">${r.verdict}</div><div class="keyword-cloud">${r.topKeywords.slice(0,8).map(([w,c])=>`<span class="keyword">${w} (${c})</span>`).join('')}</div></div>
            </div>
            
            <div class="pillars-container"><div class="pillars-grid" style="grid-template-columns:repeat(4,1fr)"><div class="pillar-card"><div class="pillar-icon">💡</div><div class="pillar-title">topics <span class="info-icon" data-tooltip="Main themes detected from message content (work, personal, humor, venting, planning).">i</span></div><div class="pillar-value" style="font-size:1rem">${r.topTopics.map(t=>t[0]).join(', ')||'various'}</div></div><div class="pillar-card"><div class="pillar-icon">🎭</div><div class="pillar-title">emotion <span class="info-icon" data-tooltip="Dominant emotional tone based on sentiment score.">i</span></div><div class="pillar-value" style="font-size:1rem">${r.avgSentiment>70?'joy 😊':(r.avgSentiment>55?'excitement 🤩':'neutral 😐')}</div></div><div class="pillar-card"><div class="pillar-icon">🔄</div><div class="pillar-title">turnover <span class="info-icon" data-tooltip="Average time between different speakers (minutes).">i</span></div><div class="pillar-value">${r.avgResponseTime}m</div></div><div class="pillar-card"><div class="pillar-icon">🏷️</div><div class="pillar-title">top word <span class="info-icon" data-tooltip="Most frequently used unique word (excluding common stopwords and URLs).">i</span></div><div class="pillar-value" style="font-size:1rem">"${r.topKeywords[0]?.[0]||'—'}"</div></div></div></div>
            
            <div class="stats-footer"><div class="stat-footer-item"><div class="stat-footer-label">📬 messages</div><div class="stat-footer-value">${r.total.toLocaleString()}</div></div><div class="stat-footer-item"><div class="stat-footer-label">👥 active</div><div class="stat-footer-value">${r.participants.length}</div></div><div class="stat-footer-item"><div class="stat-footer-label">🔥 hype</div><div class="stat-footer-value">${r.hypeScore}%</div></div></div>
        `;
        
        setTimeout(() => {
            const canvas = document.getElementById('timelineChart');
            if (canvas && r.timelineData.length) {
                const old = Chart.getChart(canvas); if (old) old.destroy();
                new Chart(canvas, { type: 'line', data: { labels: r.timelineData.map(d=>{let [y,m]=d.month.split('-'); return `${m}/${y.slice(-2)}`;}), datasets: [{ label: 'sentiment', data: r.timelineData.map(d=>d.avg), borderColor: '#bcfe2f', backgroundColor: 'rgba(188,254,47,0.1)', fill: true, tension: 0.3, pointRadius: 3 }] }, options: { responsive: true, maintainAspectRatio: true, scales: { y: { min: 0, max: 100, grid: { color: '#2a2a2a' }, ticks: { callback: v => v+'%' } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `Sentiment: ${Math.round(ctx.raw)}%` } } } } });
            }
        }, 50);
    }
    
    function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    
    const modal = document.getElementById('calendarModal'), cancelBtn = document.getElementById('calendarCancel'), applyBtn = document.getElementById('calendarApply');
    cancelBtn.onclick = () => modal.classList.remove('show');
    applyBtn.onclick = () => {
        const startStr = document.getElementById('calendarStart').value, endStr = document.getElementById('calendarEnd').value;
        if (!startStr || !endStr) { document.getElementById('calendarError').style.display='block'; document.getElementById('calendarError').innerText='Select both dates'; return; }
        let si = 0, ei = allDates.length-1;
        for (let i=0;i<allDates.length;i++) if (allDates[i] >= startStr) { si = i; break; }
        for (let i=allDates.length-1;i>=0;i--) if (allDates[i] <= endStr) { ei = i; break; }
        if (si > ei) { document.getElementById('calendarError').style.display='block'; document.getElementById('calendarError').innerText='No messages in range'; return; }
        currentFilter.startIdx = si; currentFilter.endIdx = ei;
        modal.classList.remove('show');
        const filtered = fullMessages.filter(m => m.date >= allDates[si] && m.date <= allDates[ei]);
        currentReport = computeGroupStatsOptimized(filtered);
        renderDashboardOptimized(currentReport);
        const startS = document.getElementById('startSlider'), endS = document.getElementById('endSlider');
        if (startS && endS) { startS.value = si; endS.value = ei; startS.dispatchEvent(new Event('input')); }
    };
</script>
</body>
</html>
